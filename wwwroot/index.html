<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TaskFlow - Task Viewer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="logo"><img src="/logo-placeholder.svg" height="48" alt="logo"></div>
    <div class="muted">CinemaLab — gestionale Registi/Film/Cinema</div>
    <nav class="nav"><button class="btn" onclick="location.href='/swagger/index.html'">API</button></nav>
  </header>

  <div class="container">
    <aside class="panel" style="min-height:400px">
      <h3>CRUD</h3>
      <div class="small">Registi</div>
      <form id="regista-form"><div><input id="reg-nome" placeholder="Nome" required></div><div><input id="reg-cognome" placeholder="Cognome" required></div><div><input id="reg-nazionalita" placeholder="Nazionalità"></div><div><button class="btn" type="submit">Crea</button></div></form>
      <table id="registi-table" class="table"><thead><tr><th>#</th><th>Nome</th><th>Cognome</th><th>Nazionalità</th><th></th></tr></thead><tbody></tbody></table>
    </aside>

    <main>
      <section class="panel grid">
        <div>
          <h3>Film</h3>
          <form id="film-form"><div><input id="film-titolo" placeholder="Titolo" required></div><div><input id="film-data" type="date"></div><div><input id="film-durata" type="number" placeholder="Durata" min="1"></div><div><select id="film-regista"></select></div><div><button class="btn">Crea Film</button></div></form>
          <table id="films-table" class="table"><thead><tr><th>#</th><th>Titolo</th><th>Data</th><th>Durata</th><th>RegistaId</th><th></th></tr></thead><tbody></tbody></table>
        </div>
        <div>
          <h3>Cinema</h3>
          <form id="cinema-form"><div><input id="cinema-nome" placeholder="Nome" required></div><div><input id="cinema-indirizzo" placeholder="Indirizzo"></div><div><input id="cinema-citta" placeholder="Città"></div><div><button class="btn">Crea Cinema</button></div></form>
          <table id="cinemas-table" class="table"><thead><tr><th>#</th><th>Nome</th><th>Indirizzo</th><th>Città</th><th></th></tr></thead><tbody></tbody></table>
        </div>
      </section>

      <section class="panel">
        <h3>Proiezioni</h3>
        <form id="proiezione-form"><div><select id="proj-film"></select></div><div><select id="proj-cinema"></select></div><div><input id="proj-data" type="date"></div><div><input id="proj-ora" type="time"></div><div><button class="btn">Crea Proiezione</button></div></form>
        <table id="proiezioni-table" class="table"><thead><tr><th>#</th><th>Film</th><th>Cinema</th><th>Data</th><th>Ora</th><th></th></tr></thead><tbody></tbody></table>
      </section>

      <section class="panel">
        <h3>Dashboard</h3>
        <div class="grid"><canvas id="chart-bar"></canvas><canvas id="chart-pie"></canvas></div>
        <div style="margin-top:12px"><canvas id="chart-heatmap" style="width:100%;height:160px"></canvas></div>
      </section>
    </main>
  </div>

  <script src="/lib/chart.min.js"></script>
  <script src="/lib/mermaid.min.js"></script>
  <link rel="stylesheet" href="/styles.design.css">
  <script src="/app-ui.js"></script>
</body>
</html>

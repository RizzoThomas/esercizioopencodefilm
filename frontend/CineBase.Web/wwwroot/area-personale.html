<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Personale - CineBase</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF8C00',
                            'orange-dark': '#E67E00',
                            dark: '#121212',
                            'dark-lighter': '#1E1E1E',
                            'dark-card': '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-brand-dark min-h-screen text-white font-sans">
    <!-- Navbar -->
    <div id="navbar-container"></div>
    
    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-brand-orange mb-2">Area Personale</h1>
            <p class="text-gray-400" id="user-welcome">Benvenuto, utente</p>
        </div>
        
        <!-- Tabs -->
        <div class="border-b border-white/10 mb-6">
            <nav class="flex gap-6" aria-label="Tabs">
                <button class="tab-btn active py-4 px-2 text-sm font-medium border-b-2 border-brand-orange text-brand-orange" data-tab="profilo">
                    <i class="fa-solid fa-user mr-2"></i>Profilo
                </button>
                <button class="tab-btn py-4 px-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white" data-tab="proiezioni">
                    <i class="fa-solid fa-bookmark mr-2"></i>Proiezioni Salvate
                </button>
                <button class="tab-btn py-4 px-2 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-white" data-tab="prenotazioni">
                    <i class="fa-solid fa-ticket mr-2"></i>Le Mie Prenotazioni
                </button>
            </nav>
        </div>
        
        <!-- Tab Content: Profilo -->
        <div id="tab-profilo" class="tab-content">
            <div class="bg-brand-dark-lighter rounded-2xl border border-white/10 p-6">
                <h2 class="text-xl font-semibold mb-6">Dati Personali</h2>
                
                <form id="profilo-form" class="space-y-6 max-w-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Nome</label>
                            <input type="text" name="nome" required
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Cognome</label>
                            <input type="text" name="cognome" required
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" name="email" disabled
                            class="w-full bg-brand-dark/50 border border-white/10 rounded-lg px-4 py-3 text-gray-400 cursor-not-allowed">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Telefono</label>
                            <input type="tel" name="telefono"
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Data di Nascita</label>
                            <input type="date" name="dataNascita"
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4 pt-4">
                        <button type="submit" id="save-profile-btn"
                            class="bg-brand-orange hover:bg-brand-orange-dark text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center gap-2">
                            <span>Salva Modifiche</span>
                            <i id="profile-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                        </button>
                        <button type="button" onclick="document.getElementById('change-password-modal').classList.remove('hidden')"
                            class="text-gray-400 hover:text-white transition-colors">
                            <i class="fa-solid fa-key mr-2"></i>Cambia Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Tab Content: Proiezioni Salvate -->
        <div id="tab-proiezioni" class="tab-content hidden">
            <div class="bg-brand-dark-lighter rounded-2xl border border-white/10 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold">Proiezioni Salvate</h2>
                    <span id="saved-count" class="text-sm text-gray-400">0 elementi</span>
                </div>
                
                <div id="saved-proiezioni-list" class="space-y-4">
                    <!-- Loading -->
                    <div class="text-center py-12">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-orange"></i>
                        <p class="mt-4 text-gray-400">Caricamento...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tab Content: Prenotazioni -->
        <div id="tab-prenotazioni" class="tab-content hidden">
            <div class="bg-brand-dark-lighter rounded-2xl border border-white/10 p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold">Le Mie Prenotazioni</h2>
                    <span id="prenotazioni-count" class="text-sm text-gray-400">0 elementi</span>
                </div>
                
                <div id="prenotazioni-list" class="space-y-4">
                    <!-- Loading -->
                    <div class="text-center py-12">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-orange"></i>
                        <p class="mt-4 text-gray-400">Caricamento...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Change Password Modal -->
    <div id="change-password-modal" class="fixed inset-0 z-50 hidden">
        <div class="fixed inset-0 bg-black/75 backdrop-blur-sm"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4">
                <div class="bg-brand-dark-lighter rounded-2xl border border-white/10 p-6 w-full max-w-md">
                    <h3 class="text-xl font-semibold mb-4">Cambia Password</h3>
                    
                    <form id="change-password-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Password Attuale</label>
                            <input type="password" name="currentPassword" required
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Nuova Password</label>
                            <input type="password" name="newPassword" required minlength="6"
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Conferma Nuova Password</label>
                            <input type="password" name="confirmPassword" required minlength="6"
                                class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
                        </div>
                        
                        <div id="password-error" class="hidden bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg text-sm"></div>
                        
                        <div class="flex gap-3 pt-4">
                            <button type="button" onclick="document.getElementById('change-password-modal').classList.add('hidden')"
                                class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-semibold py-3 rounded-lg transition-colors">
                                Annulla
                            </button>
                            <button type="submit" id="change-password-btn"
                                class="flex-1 bg-brand-orange hover:bg-brand-orange-dark text-white font-semibold py-3 rounded-lg transition-colors">
                                Cambia Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>
    
    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>
    
	<!-- Scripts -->
	<script src="/js/utils.js"></script>
	<script src="/js/api.js"></script>
	<script src="/js/auth.js"></script>
	<script src="/js/router.js"></script>
	<script src="/js/navbar.js"></script>
	<script src="/js/template-loader.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', async function() {
			await loadComponent('navbar-container', '/components/navbar-landing.html');
			await loadComponent('footer-container', '/components/footer-landing.html');
			if (typeof updateNavbarForAuth === 'function') {
				updateNavbarForAuth();
			}
		});
	</script>
	<script src="/js/pages/area-personale.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - CineBase</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF8C00',
                            'orange-dark': '#E67E00',
                            dark: '#121212',
                            'dark-lighter': '#1E1E1E',
                            'dark-card': '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-brand-dark min-h-screen flex items-center justify-center font-sans">
    <div class="bg-brand-dark-lighter p-8 rounded-2xl border border-white/10 w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-brand-orange mb-2">🎬 CineBase</h1>
            <p class="text-gray-400">Crea il tuo account</p>
        </div>
        
        <form id="register-form" class="space-y-5" action="javascript:void(0)" onsubmit="event.preventDefault(); return false;">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Nome</label>
                    <input type="text" name="nome" required
                        class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-brand-orange"
                        placeholder="Mario">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Cognome</label>
                    <input type="text" name="cognome" required
                        class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-brand-orange"
                        placeholder="Rossi">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="email" name="email" required
                        class="w-full bg-brand-dark border border-white/10 rounded-lg pl-10 pr-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-brand-orange"
                        placeholder="tu@email.com">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="password" name="password" required minlength="6"
                        class="w-full bg-brand-dark border border-white/10 rounded-lg pl-10 pr-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-brand-orange"
                        placeholder="Minimo 6 caratteri">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Telefono (opzionale)</label>
                <div class="relative">
                    <i class="fa-solid fa-phone absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                    <input type="tel" name="telefono"
                        class="w-full bg-brand-dark border border-white/10 rounded-lg pl-10 pr-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-brand-orange"
                        placeholder="+39 333 1234567">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Data di nascita (opzionale)</label>
                <input type="date" name="dataNascita"
                    class="w-full bg-brand-dark border border-white/10 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-brand-orange">
            </div>
            
            <div id="error-message" class="hidden bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg text-sm"></div>
            
            <button type="submit" id="submit-btn"
                class="w-full bg-brand-orange hover:bg-brand-orange-dark text-white font-semibold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                <span id="btn-text">Registrati</span>
                <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">
                Hai già un account? 
                <a href="/login.html" class="text-brand-orange hover:underline font-medium">Accedi</a>
            </p>
        </div>
    </div>
    
<!-- Scripts -->
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/router.js"></script>
<script src="/js/pages/register.js"></script>
</body>
</html>

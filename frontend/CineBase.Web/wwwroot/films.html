<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase — Gestione Film</title>
  <script src="/js/early-route-guard.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { cyber: { dark: '#030712', cyan: '#00f5ff', purple: '#a855f7', pink: '#ff0080', green: '#39ff14' }}}}
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-[#030712] text-slate-200 font-sans cyber-scanlines cyber-hex-bg">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-1 h-8 bg-cyan-400 rounded-full shadow-[0_0_10px_rgba(0,245,255,0.5)]"></div>
        <div>
          <h1 class="font-cyber text-xl font-bold tracking-wider text-white">GESTIONE FILM</h1>
          <p class="text-xs text-slate-600 font-mono mt-0.5">Catalogo cinematografico</p>
        </div>
      </div>
      <div class="flex gap-3">
        <button class="cyber-btn text-xs py-2 px-4 border-cyan-400/30 text-slate-400 hover:text-cyan-400">
          <i class="fa-solid fa-download mr-1"></i>Export
        </button>
        <button onclick="openModal('film-modal', 'AGGIUNGI FILM')" class="cyber-btn cyber-btn-primary text-xs py-2 px-4">
          <i class="fa-solid fa-plus mr-1"></i>Nuovo Film
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="cyber-stat">
        <div class="cyber-stat-value" id="total-films">-</div>
        <div class="cyber-stat-label">Film Totali</div>
      </div>
      <div class="cyber-stat">
        <div class="cyber-stat-value text-purple-400" id="new-releases">-</div>
        <div class="cyber-stat-label">Di Registi</div>
      </div>
      <div class="cyber-stat">
        <div class="cyber-stat-value text-pink-400" style="text-shadow:0 0 20px rgba(255,0,128,0.4)">-</div>
        <div class="cyber-stat-label">Genere</div>
      </div>
      <div class="cyber-stat">
        <div class="cyber-stat-value text-green-400" style="text-shadow:0 0 20px rgba(57,255,20,0.4)">-</div>
        <div class="cyber-stat-label">Cinema</div>
      </div>
    </div>

    <!-- Search -->
    <div class="glass-panel p-4 mb-6 flex flex-col md:flex-row gap-4">
      <div class="flex-1 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-cyan-400/40 text-sm"></i>
        <input type="text" id="search-input" placeholder="Cerca nel catalogo..." class="cyber-input pl-10 text-sm">
      </div>
      <select id="genre-filter" class="cyber-select text-sm max-w-[200px]">
        <option value="all">Tutti i Generi</option>
        <option value="azione">Azione</option>
        <option value="commedia">Commedia</option>
        <option value="dramma">Dramma</option>
        <option value="fantascienza">Fantascienza</option>
        <option value="horror">Horror</option>
      </select>
    </div>

    <!-- Table -->
    <div class="glass-panel overflow-hidden">
      <div class="overflow-x-auto">
        <table class="cyber-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>POSTER</th>
              <th>TITOLO</th>
              <th>DATA</th>
              <th>REGISTA</th>
              <th>DURATA</th>
              <th>AZIONI</th>
            </tr>
          </thead>
          <tbody id="films-table-body">
            <tr><td colspan="7" class="text-center text-slate-600 font-mono text-sm py-8">
              <i class="fa-solid fa-spinner fa-spin text-cyan-400/40 text-lg mb-2 block"></i>Caricamento...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <!-- Modal -->
  <div id="film-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 cyber-modal-backdrop" onclick="closeModal('film-modal')"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="cyber-modal w-full max-w-lg relative">
          <div class="cyber-modal-header flex items-center justify-between">
            <span id="modal-title" class="font-cyber text-sm font-bold tracking-wider">AGGIUNGI FILM</span>
            <button onclick="closeModal('film-modal')" class="text-slate-500 hover:text-cyan-400 transition-colors">
              <i class="fa-solid fa-xmark text-lg"></i>
            </button>
          </div>
          <div class="p-6">
            <form id="film-form" class="space-y-4">
              <input type="hidden" name="id" value="">
              <div>
                <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Titolo</label>
                <input type="text" name="titolo" required class="cyber-input text-sm" placeholder="Titolo del film">
              </div>
              <div>
                <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Data Produzione</label>
                <input type="date" name="dataProduzione" required class="cyber-input text-sm">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Durata (min)</label>
                  <input type="number" name="durata" required class="cyber-input text-sm" placeholder="120">
                </div>
                <div>
                  <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Regista</label>
                  <select id="regista-select" name="registaId" required class="cyber-select text-sm">
                    <option value="">Seleziona...</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Copertina URL</label>
                <input type="url" name="copertinaPath" class="cyber-input text-sm" placeholder="https://...">
              </div>
              <div>
                <label class="block text-xs font-mono text-slate-500 mb-1 uppercase tracking-wider">Filmato URL</label>
                <input type="url" name="filmatoPath" class="cyber-input text-sm" placeholder="https://...">
              </div>
            </form>
          </div>
          <div class="cyber-modal-footer flex justify-end gap-3">
            <button type="button" onclick="closeModal('film-modal')" class="cyber-btn text-xs py-2 px-4 border-cyan-400/30 text-slate-400 hover:text-cyan-400">Annulla</button>
            <button type="submit" form="film-form" class="cyber-btn cyber-btn-primary text-xs py-2 px-4">Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 cyber-modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="cyber-modal w-full max-w-md relative">
          <div class="p-6">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-xl bg-pink-500/10 border border-pink-500/30 flex items-center justify-center">
                <i class="fa-solid fa-triangle-exclamation text-pink-400 text-xl"></i>
              </div>
              <div>
                <h3 class="font-cyber text-sm font-bold text-white tracking-wider">CONFERMA ELIMINAZIONE</h3>
                <p class="text-sm text-slate-400 mt-1" id="delete-message">Sei sicuro?</p>
              </div>
            </div>
          </div>
          <div class="cyber-modal-footer flex justify-end gap-3">
            <button type="button" onclick="closeDeleteModal()" class="cyber-btn text-xs py-2 px-4 border-cyan-400/30 text-slate-400">Annulla</button>
            <button type="button" id="confirm-delete-btn" class="cyber-btn cyber-btn-danger text-xs py-2 px-4">Elimina</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    var allFilms = [];
    var allRegisti = [];

    function normalizeCollection(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.$values)) return data.$values;
      if (data && Array.isArray(data.items)) return data.items;
      return [];
    }

    document.addEventListener('DOMContentLoaded', async function() {
      await loadComponent('navbar-container', '/components/navbar-admin.html');
      await loadComponent('footer-container', '/components/footer-admin.html');
      await Promise.all([loadFilms(), loadRegistiList()]);
      populateRegistiSelect();
      setupFilters();
      setupFormSubmit();
    });

    async function loadFilms() {
      var tbody = document.getElementById('films-table-body');
      if (!tbody) return;
      try {
        var films = normalizeCollection(await API.getFilms());
        allFilms = films;
        renderFilms(films);
        updateStats(films);
      } catch(e) {
        handleApiError(e);
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-pink-400 font-mono text-sm py-4">Errore di connessione</td></tr>';
      }
    }

    async function loadRegistiList() {
      try {
        allRegisti = normalizeCollection(await API.getRegisti());
      } catch(e) { console.error('Registi error:', e); }
    }

    function populateRegistiSelect() {
      var select = document.getElementById('regista-select');
      if (!select) return;
      select.innerHTML = '<option value="">Seleziona regista...</option>';
      allRegisti.forEach(function(r) {
        var opt = document.createElement('option');
        opt.value = String(r.id);
        opt.textContent = r.nome + ' ' + r.cognome;
        select.appendChild(opt);
      });
    }

    function renderFilms(films) {
      var tbody = document.getElementById('films-table-body');
      if (!tbody) return;
      if (!films.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-600 font-mono text-sm py-8">Nessun film nel sistema</td></tr>';
        return;
      }
      tbody.innerHTML = films.map(function(f) {
        var regista = allRegisti.find(function(r) { return r.id == f.registaId; });
        var registaName = regista ? regista.nome + ' ' + regista.cognome : '---';
        return '<tr>' +
          '<td class="font-mono text-xs text-slate-600">' + f.id + '</td>' +
          '<td><div class="w-8 h-10 rounded bg-slate-800 overflow-hidden"><img src="' + (f.copertinaPath || '') + '" alt="" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML=\'<i class=\\\'fa-solid fa-film text-slate-600 text-xs flex items-center justify-center w-full h-full\\\'></i>\'"></div></td>' +
          '<td class="font-medium text-white text-sm">' + f.titolo + '</td>' +
          '<td class="text-slate-400 text-sm font-mono">' + (f.dataProduzione ? new Date(f.dataProduzione).toLocaleDateString('it-IT') : '---') + '</td>' +
          '<td class="text-slate-400 text-sm">' + registaName + '</td>' +
          '<td class="text-slate-400 text-sm font-mono">' + (f.durata || '-') + ' min</td>' +
          '<td>' +
            '<button onclick="editFilm(' + f.id + ')" class="text-cyan-400/60 hover:text-cyan-400 mr-3 transition-colors"><i class="fa-solid fa-pencil text-xs"></i></button>' +
            '<button onclick="deleteFilm(' + f.id + ', \'' + f.titolo.replace(/'/g, "\\'") + '\')" class="text-pink-400/60 hover:text-pink-400 transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function updateStats(films) {
      var el = document.getElementById('total-films');
      if (el) el.textContent = films.length;
    }

    function setupFilters() {
      var search = document.getElementById('search-input');
      var genre = document.getElementById('genre-filter');
      search && search.addEventListener('input', function(e) { filterFilms(e.target.value, genre && genre.value); });
      genre && genre.addEventListener('change', function(e) { filterFilms(search && search.value, e.target.value); });
    }

    function filterFilms(search, genre) {
      var filtered = allFilms;
      if (search) {
        var q = search.toLowerCase();
        filtered = filtered.filter(function(f) {
          return (f.titolo && f.titolo.toLowerCase().includes(q));
        });
      }
      if (genre && genre !== 'all') {
        filtered = filtered.filter(function(f) { return f.genere && f.genere === genre; });
      }
      renderFilms(filtered);
    }

    function setupFormSubmit() {
      var form = document.getElementById('film-form');
      if (!form) return;
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var data = {};
        var formData = new FormData(form);
        formData.forEach(function(v, k) { data[k] = v; });
        if (data.registaId) data.registaId = Number(data.registaId);
        if (data.durata) data.durata = Number(data.durata);
        var editId = form.dataset.editId;
        try {
          if (editId) { await API.updateFilm(editId, data); showToast('Film aggiornato', 'success'); }
          else { await API.createFilm(data); showToast('Film creato', 'success'); }
          closeModal('film-modal');
          loadFilms();
        } catch(err) { handleApiError(err); }
      });
    }

    async function editFilm(id) {
      try {
        var film = await API.getFilm(id);
        openModal('film-modal', 'MODIFICA FILM');
        var form = document.getElementById('film-form');
        form.dataset.editId = id;
        form.querySelector('[name="titolo"]').value = film.titolo || '';
        form.querySelector('[name="dataProduzione"]').value = film.dataProduzione ? film.dataProduzione.split('T')[0] : '';
        form.querySelector('[name="durata"]').value = film.durata || '';
        form.querySelector('[name="copertinaPath"]').value = film.copertinaPath || '';
        form.querySelector('[name="filmatoPath"]').value = film.filmatoPath || '';
        form.querySelector('[name="registaId"]').value = film.registaId || '';
      } catch(err) { handleApiError(err); }
    }

    async function deleteFilm(id, title) {
      document.getElementById('delete-message').textContent = 'Eliminare "' + title + '" dal sistema?';
      document.getElementById('delete-modal').classList.remove('hidden');
      document.getElementById('confirm-delete-btn').onclick = async function() {
        try {
          await API.deleteFilm(id);
          showToast('Film eliminato', 'success');
          closeDeleteModal();
          loadFilms();
        } catch(err) { handleApiError(err); }
      };
    }

    function openModal(id, title) {
      var m = document.getElementById(id);
      if (!m) return;
      m.classList.remove('hidden');
      var t = document.getElementById('modal-title');
      if (t) t.textContent = title;
      var form = document.getElementById('film-form');
      if (form) { form.reset(); form.dataset.editId = ''; }
    }

    function closeModal(id) {
      var m = document.getElementById(id);
      if (m) m.classList.add('hidden');
    }

    function closeDeleteModal() {
      var m = document.getElementById('delete-modal');
      if (m) m.classList.add('hidden');
    }
  </script>
</body>
</html>

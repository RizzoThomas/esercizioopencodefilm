<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Gestione Utenti</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=26" rel="stylesheet">
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-canvas text-ink font-sans">
  <main>
    <div class="flex items-center justify-between gap-4 mb-6">
      <p class="text-sm text-body">Gestisci gli utenti della piattaforma</p>
    </div>

    <!-- Search -->
    <div class="mb-4">
      <input type="text" id="utenti-search" class="input-ferrari w-full sm:w-72" placeholder="Cerca per nome o email..."
        oninput="filterUtenti()">
    </div>

    <!-- Users table -->
    <div class="card-ferrari overflow-x-auto">
      <table class="min-w-full divide-y divide-hairline">
        <thead class="bg-canvas-elevated">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">ID</th>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">Email</th>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">Nome</th>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">Cognome</th>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">Ruolo</th>
            <th class="px-4 py-3 text-right text-xs font-medium label-caps">Credito</th>
            <th class="px-4 py-3 text-left text-xs font-medium label-caps">Registrazione</th>
            <th class="px-4 py-3 text-center text-xs font-medium label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="utenti-table-body" class="divide-y divide-hairline">
          <tr>
            <td colspan="8" class="px-4 py-8 text-center text-body">Caricamento utenti...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Edit User Modal -->
  <div id="utenti-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/70" onclick="closeUtenteModal()"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="bg-canvas-elevated p-6 w-full max-w-md">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-ink">
              <i class="fa-solid fa-user-edit text-ferrari-primary mr-2"></i>Modifica Utente
            </h3>
            <button onclick="closeUtenteModal()" class="text-body hover:text-ink"><i class="fa-solid fa-xmark text-xl"></i></button>
          </div>
          <form id="utenti-edit-form" class="space-y-4">
            <input type="hidden" id="edit-user-id">
            <div>
              <label class="block text-sm font-medium text-ink mb-1">Email</label>
              <input type="email" id="edit-user-email" class="input-ferrari w-full bg-canvas cursor-not-allowed" readonly>
            </div>
            <div>
              <label class="block text-sm font-medium text-ink mb-1">Nome</label>
              <input type="text" id="edit-user-nome" class="input-ferrari w-full" readonly>
            </div>
            <div>
              <label class="block text-sm font-medium text-ink mb-1">Cognome</label>
              <input type="text" id="edit-user-cognome" class="input-ferrari w-full" readonly>
            </div>
            <div>
              <label class="block text-sm font-medium text-ink mb-1">Ruolo</label>
              <select id="edit-user-ruolo" class="input-ferrari w-full">
                <option value="User">User</option>
                <option value="PowerUser">PowerUser</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-ink mb-1">Credito (€)</label>
              <input type="number" id="edit-user-credito" class="input-ferrari w-full" step="0.01" min="0">
            </div>
          </form>
          <div class="mt-4 flex gap-3">
            <button onclick="closeUtenteModal()" class="btn-outline flex-1">Annulla</button>
            <button onclick="saveUtente()" class="btn-primary flex-1"><i class="fa-solid fa-floppy-disk mr-1"></i>Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/admin-shell.js"></script>
  <script src="/js/pages/utenti.js"></script>
</body>
</html>

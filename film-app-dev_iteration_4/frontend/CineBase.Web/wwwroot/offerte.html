<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Offerte Speciali</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=30" rel="stylesheet">
  <script src="/js/theme.js"></script>

</head>

<body class="bg-canvas text-ink font-sans cinematic-enter-page">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 pt-24">
    <div class="flex items-end justify-between gap-4 mb-10">
      <div>
        <p class="page-header-eyebrow mb-3">Promozioni</p>
        <h1 class="page-header-title">Offerte Speciali</h1>
        <p class="page-header-subtitle mt-3">Combo cinema per risparmiare su biglietti e snack. Scegli l'offerta e poi seleziona lo spettacolo.</p>
      </div>
      <a href="/programmazione.html" class="btn-outline hidden sm:inline-flex">
        <i class="fa-solid fa-film mr-2"></i>Vai alla programmazione
      </a>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <label for="cinema-filter" class="text-sm uppercase tracking-[0.2em] text-body">Cinema</label>
        <select id="cinema-filter" class="cinema-filter px-4 py-2">
          <option value="">Tutti i cinema</option>
        </select>
      </div>
    </div>

    <div id="loading-state" class="text-center py-20">
      <div class="inline-flex flex-col items-center gap-4">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-ferrari-primary"></i>
        <p class="text-body">Caricamento offerte...</p>
      </div>
    </div>

    <div id="error-state" class="hidden text-center py-20 card-ferrari">
      <i class="fa-solid fa-circle-exclamation text-5xl text-ferrari-semantic-warning mb-4"></i>
      <h2 class="text-xl font-semibold text-ink mb-2">Impossibile caricare le offerte</h2>
      <p id="error-message" class="text-body mb-6"></p>
      <button id="retry-button" class="btn-primary">Riprova</button>
    </div>

    <div id="offers-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden"></div>

    <section class="mt-16 orb-bg">
      <div class="orb-overlay" aria-hidden="true"></div>
      <div class="flex items-end justify-between gap-4 mb-8">
        <div>
          <p class="page-header-eyebrow mb-3">Abbonamenti</p>
          <h2 class="page-header-title">Piani mensili e annuali</h2>
        </div>
      </div>
      <div id="subscriptions-loading" class="text-center py-12 card-ferrari">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-ferrari-primary"></i>
        <p class="text-body">Caricamento abbonamenti...</p>
      </div>
      <div id="subscriptions-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden"></div>
    </section>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js?v=2"></script>
  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/template-loader.js?v=5"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=7"></script>
  <script>
    function formatCurrency(value) {
      const amount = Number(value || 0);
      return amount.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
    }

    function getOfferImage(tipo, includePopcorn) {
      // Cinema-themed Unsplash photos
      if (tipo === 'biglietti_popcorn' || (includePopcorn || 0) > 0) {
        return 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=800&h=400&fit=crop'; // popcorn cinema
      }
      return 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&h=400&fit=crop'; // cinema seats
    }

    function getSubscriptionImage(tipo) {
      const images = {
        'mensile':  'https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=800&h=400&fit=crop', // projector
        'annuale':  'https://images.unsplash.com/photo-1585647347483-22b66260dfff?w=800&h=400&fit=crop', // tickets
        'premium':  'https://images.unsplash.com/photo-1514306191717-452ec28c7814?w=800&h=400&fit=crop', // cinema screen
        'vip':      'https://images.unsplash.com/photo-1595769816263-9b910be24d5f?w=800&h=400&fit=crop', // luxury theater
      };
      return images[tipo] || images['mensile'];
    }

    function renderOfferCard(offerta) {
      const extraItems = [];
      if ((offerta.numeroBiglietti || 0) > 0) extraItems.push(`${offerta.numeroBiglietti} biglietti`);
      if ((offerta.includePopcorn || 0) > 0) extraItems.push(`${offerta.includePopcorn} popcorn`);

      const itemsText = extraItems.length ? extraItems.join(' + ') : 'Contenuto variabile';
      const price = formatCurrency(offerta.prezzo);
      const originalPrice = offerta.prezzoOriginale ? formatCurrency(offerta.prezzoOriginale) : '';
      const imageUrl = getOfferImage(offerta.tipo, offerta.includePopcorn);

      return `
        <article class="offer-card ${offerta.inEvidenza ? 'highlight-card' : ''} card-ferrari p-0 flex flex-col h-full relative overflow-hidden card-spotlight-enhanced group ring-glow-card">
          <div class="h-44 relative overflow-hidden">
            <img src="${imageUrl}" alt="${offerta.nome}" class="w-full h-full object-cover transition-transform duration-700 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:scale-105" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-[#181818] via-transparent to-transparent"></div>
            ${offerta.cinemaNome ? `<span class="absolute bottom-2 left-3 px-2 py-0.5 text-[10px] uppercase tracking-wider bg-black/50 text-white/90">${offerta.cinemaNome}</span>` : ''}
          </div>
          <div class="absolute top-3 left-3 flex flex-col gap-1.5 z-10">
            ${offerta.inEvidenza ? '<span class="offer-badge-accent">Migliore Offerta</span>' : ''}
            ${offerta.scontoPercentuale > 0 ? `<span class="offer-discount-badge">\u2212${offerta.scontoPercentuale}%</span>` : ''}
          </div>
          <div class="p-6 flex-1 flex flex-col">
            <div class="flex-1">
              <div class="mb-4">
                <p class="text-ferrari-primary uppercase tracking-[0.15em] text-xs mb-1.5">${offerta.tipo || 'Offerta'}</p>
                <h2 class="ferrari-title-md text-ink leading-tight">${offerta.nome}</h2>
              </div>
              <p class="text-body mb-4 leading-relaxed text-sm">${offerta.descrizione || ''}</p>
              <div class="space-y-1.5 text-sm text-ink/90">
                <div class="flex items-center gap-2"><i class="fa-solid fa-circle-check text-ferrari-primary text-xs"></i><span>${itemsText}</span></div>
              </div>
            </div>
            <div class="mt-5 pt-4 border-t border-hairline flex items-center justify-between gap-3">
              <div>
                <p class="text-[10px] uppercase tracking-[0.2em] text-body">Prezzo</p>
                <div class="flex items-baseline gap-2 flex-wrap">
                  <p class="text-xl font-bold text-ink">${price}</p>
                  ${originalPrice ? `<span class="text-xs text-body/60 line-through">${originalPrice}</span>` : ''}
                </div>
              </div>
              <button class="btn-primary text-sm whitespace-nowrap offer-acquista-btn ripple-container magnetic-btn" data-offer-id="${offerta.id}" data-cinema-id="${offerta.cinemaId || ''}">
                Acquista
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderSubscriptionCard(abbonamento) {
      const price = formatCurrency(abbonamento.prezzo);
      const annualPrice = abbonamento.prezzoAnnuale ? formatCurrency(abbonamento.prezzoAnnuale) : '';
      const annualSavings = abbonamento.prezzoAnnuale ? Math.max(0, Math.round((abbonamento.prezzo * 12 - abbonamento.prezzoAnnuale) * 100) / 100) : 0;
      const popcornText = abbonamento.includePopcornPerMese > 0
        ? `${abbonamento.includePopcornPerMese} popcorn/mese`
        : 'Nessun popcorn incluso';
      const imageUrl = getSubscriptionImage(abbonamento.tipo);

      return `
        <article class="subscription-card card-ferrari p-0 flex flex-col h-full overflow-hidden card-spotlight-enhanced group ring-glow-card">
          <div class="h-36 relative overflow-hidden">
            <img src="${imageUrl}" alt="${abbonamento.nome}" class="w-full h-full object-cover transition-transform duration-700 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:scale-105" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-[#181818] via-transparent to-transparent"></div>
          </div>
          <div class="p-6 flex-1 flex flex-col">
            <div class="flex-1">
              <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
                <div>
                  <p class="text-ferrari-primary uppercase tracking-[0.15em] text-xs mb-2">${abbonamento.tipo}</p>
                  <h3 class="ferrari-title-md text-ink">${abbonamento.nome}</h3>
                </div>
                ${abbonamento.scontoPercentuale > 0 ? `<span class="offer-discount-badge">\u2212${abbonamento.scontoPercentuale}%</span>` : ''}
              </div>
              <p class="text-body mb-5 leading-relaxed">${abbonamento.descrizione || ''}</p>
              <div class="space-y-2 text-sm text-ink/90">
                <div class="flex items-center gap-2"><i class="fa-solid fa-ticket text-ferrari-primary"></i><span>${abbonamento.numeroBigliettiPerMese} biglietti/mese</span></div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-popcorn text-ferrari-primary"></i><span>${popcornText}</span></div>
              </div>
            </div>
            <div class="mt-6 pt-4 border-t border-hairline space-y-3">
              <div>
                <p class="text-xs uppercase tracking-[0.2em] text-body">Prezzo mensile</p>
                <p class="text-2xl font-bold text-ink">${price}</p>
              </div>
              ${annualPrice ? `<p class="text-sm text-body">Annuale: <span class="text-ink font-semibold">${annualPrice}</span> \u00b7 risparmi ${formatCurrency(annualSavings)}</p>` : ''}
              <button class="btn-primary inline-flex justify-center w-full sm:w-auto subscription-action-btn ripple-container magnetic-btn" data-subscription-id="${abbonamento.id}" data-subscription-name="${abbonamento.nome}">
                ${typeof Auth !== 'undefined' && Auth.isLoggedIn() ? 'Attiva' : 'Accedi'}
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderSubscriptionCard(abbonamento) {
      const price = formatCurrency(abbonamento.prezzo);
      const annualPrice = abbonamento.prezzoAnnuale ? formatCurrency(abbonamento.prezzoAnnuale) : '';
      const annualSavings = abbonamento.prezzoAnnuale ? Math.max(0, Math.round((abbonamento.prezzo * 12 - abbonamento.prezzoAnnuale) * 100) / 100) : 0;
      const popcornText = abbonamento.includePopcornPerMese > 0
        ? `${abbonamento.includePopcornPerMese} popcorn/mese`
        : 'Nessun popcorn incluso';

      return `
        <article class="subscription-card card-ferrari p-6 flex flex-col h-full">
          <div class="flex-1">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
              <div>
                <p class="text-ferrari-primary uppercase tracking-[0.15em] text-xs mb-2">${abbonamento.tipo}</p>
                <h3 class="ferrari-title-md text-ink">${abbonamento.nome}</h3>
              </div>
              ${abbonamento.scontoPercentuale > 0 ? `<span class="offer-discount-badge">−${abbonamento.scontoPercentuale}%</span>` : ''}
            </div>
            <p class="text-body mb-5 leading-relaxed">${abbonamento.descrizione || ''}</p>
            <div class="space-y-2 text-sm text-ink/90">
              <div class="flex items-center gap-2"><i class="fa-solid fa-ticket text-ferrari-primary"></i><span>${abbonamento.numeroBigliettiPerMese} biglietti/mese</span></div>
              <div class="flex items-center gap-2"><i class="fa-solid fa-popcorn text-ferrari-primary"></i><span>${popcornText}</span></div>
            </div>
          </div>
          <div class="mt-6 pt-4 border-t border-hairline space-y-3">
            <div>
              <p class="text-xs uppercase tracking-[0.2em] text-body">Prezzo mensile</p>
              <p class="text-2xl font-bold text-ink">${price}</p>
            </div>
            ${annualPrice ? `<p class="text-sm text-body">Annuale: <span class="text-ink font-semibold">${annualPrice}</span> · risparmi ${formatCurrency(annualSavings)}</p>` : ''}
            <button class="btn-primary inline-flex justify-center w-full sm:w-auto subscription-action-btn" data-subscription-id="${abbonamento.id}" data-subscription-name="${abbonamento.nome}">
              ${typeof Auth !== 'undefined' && Auth.isLoggedIn() ? 'Attiva' : 'Accedi'}
            </button>
          </div>
        </article>
      `;
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'px-4 py-3 rounded-lg text-sm font-medium mb-2 ' + (type === 'info' ? 'bg-ferrari-primary/20 text-ink border border-ferrari-primary/30' : 'bg-canvas-elevated text-ink border border-hairline');
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function showShowPicker(shows, offerId) {
      const oldOverlay = document.querySelector('[data-show-picker-overlay]');
      if (oldOverlay) oldOverlay.remove();

      const overlay = document.createElement('div');
      overlay.dataset.showPickerOverlay = 'true';
      overlay.className = 'fixed inset-0 bg-black/60 z-50 flex items-start justify-center pt-[8vh] p-4';
      overlay.innerHTML = `
        <div class="bg-canvas-elevated border border-hairline w-full max-w-xl flex flex-col" style="max-height:82vh">
          <!-- Header — sticky -->
          <div class="flex items-start justify-between gap-3 p-5 pb-3 border-b border-hairline shrink-0">
            <div>
              <p class="text-ferrari-primary uppercase tracking-[0.15em] text-[11px] font-semibold mb-1">Seleziona spettacolo</p>
              <h3 class="text-lg font-bold text-ink">Scegli dove usare l'offerta</h3>
            </div>
            <button class="text-body hover:text-ink text-xl close-picker-btn leading-none mt-0.5" aria-label="Chiudi">&times;</button>
          </div>

          <!-- Show list — scrollable -->
          <div class="overflow-y-auto flex-1 p-3 space-y-1.5">
            ${shows.map((s) => {
              const showDate = s.startAtUtc ? new Date(s.startAtUtc).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Data non disponibile';
              return `
                <button class="show-picker-btn w-full text-left p-3 bg-canvas border border-hairline hover:border-ferrari-primary transition-colors group"
                  data-show-id="${s.id}">
                  <div class="flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <p class="text-sm font-semibold text-ink truncate group-hover:text-ferrari-primary transition-colors">${s.filmTitolo || 'Film'}</p>
                      <p class="text-xs text-body mt-0.5">${showDate} · ${s.cinemaNome || ''}${s.salaNome ? ` · ${s.salaNome}` : ''}</p>
                    </div>
                    <div class="shrink-0 text-ferrari-primary opacity-70 group-hover:opacity-100 transition-opacity">
                      <i class="fa-solid fa-arrow-right text-sm"></i>
                    </div>
                  </div>
                </button>`;
            }).join('')}
          </div>

          <!-- Footer — sticky -->
          <div class="p-3 pt-0 border-t border-hairline shrink-0">
            <button class="w-full btn-outline text-sm py-2 close-picker-btn">Annulla</button>
          </div>
        </div>`;

      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) close();
      });
      overlay.querySelectorAll('.close-picker-btn').forEach((btn) => btn.addEventListener('click', close));
      overlay.querySelectorAll('.show-picker-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const showId = btn.dataset.showId;
          if (!showId) return;
          close();
            window.location.href = `/acquista.html?showId=${encodeURIComponent(showId)}&offertaId=${encodeURIComponent(offerId)}`;
          });
        });
    }

    function normalizeCollection(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.$values)) return data.$values;
      if (Array.isArray(data?.items)) return data.items;
      return [];
    }

    async function loadCinemaFilter() {
      const filter = document.getElementById('cinema-filter');
      if (!filter) return;

      try {
        const cinemas = normalizeCollection(await API.getCinemas());
        const currentValue = filter.value;
        filter.innerHTML = '<option value="">Tutti i cinema</option>' + cinemas.map((cinema) => `
          <option value="${cinema.id}">${cinema.nome}</option>
        `).join('');
        filter.value = currentValue;
      } catch (error) {
        console.error('Impossibile caricare i cinema', error);
      }
    }

    async function loadOffers() {
      const loading = document.getElementById('loading-state');
      const errorState = document.getElementById('error-state');
      const grid = document.getElementById('offers-grid');
      const cinemaFilter = document.getElementById('cinema-filter');

      loading.classList.remove('hidden');
      errorState.classList.add('hidden');
      grid.classList.add('hidden');

      try {
        const offers = await API.getOfferte(cinemaFilter?.value || '');
        grid.innerHTML = (offers || []).map(renderOfferCard).join('') || `
          <div class="col-span-full text-center py-12 card-ferrari">
            <p class="text-body">Nessuna offerta disponibile al momento.</p>
          </div>
        `;

        grid.querySelectorAll('.offer-acquista-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const offerId = btn.getAttribute('data-offer-id');
            const cinemaId = btn.getAttribute('data-cinema-id');
            if (!offerId) return;
            const isLoggedIn = typeof Auth !== 'undefined' && Auth.isLoggedIn && Auth.isLoggedIn();
            if (!isLoggedIn) {
              window.location.href = '/login.html?redirect=' + encodeURIComponent('/offerte.html');
              return;
            }

            (async () => {
              try {
                const shows = normalizeCollection(await API.getShows(cinemaId));
                if (!shows.length) {
                  showToast('Nessuno spettacolo disponibile per questo cinema', 'warning');
                  return;
                }
                showShowPicker(shows, offerId);
              } catch (error) {
                console.error(error);
                showToast('Errore caricamento spettacoli', 'danger');
              }
            })();
          });
        });

        loading.classList.add('hidden');
        grid.classList.remove('hidden');
      } catch (error) {
        loading.classList.add('hidden');
        errorState.classList.remove('hidden');
        document.getElementById('error-message').textContent = error?.message || 'Errore durante il caricamento delle offerte.';
      }
    }

    async function loadSubscriptions() {
      const loading = document.getElementById('subscriptions-loading');
      const grid = document.getElementById('subscriptions-grid');

      try {
        const abbonamenti = await API.getAbbonamenti();
        grid.innerHTML = (abbonamenti || []).map(renderSubscriptionCard).join('') || `
          <div class="col-span-full text-center py-12 card-ferrari">
            <p class="text-body">Nessun abbonamento disponibile al momento.</p>
          </div>
        `;

        grid.querySelectorAll('.subscription-action-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (typeof Auth === 'undefined' || !Auth.isLoggedIn()) {
              window.location.href = '/login.html?redirect=/offerte.html';
              return;
            }
            window.location.href = '/pagamento.html?abbonamentoId=' + encodeURIComponent(btn.dataset.subscriptionId || '');
          });
        });

        loading.classList.add('hidden');
        grid.classList.remove('hidden');
      } catch (error) {
        loading.innerHTML = `<p class="text-ferrari-semantic-warning">Impossibile caricare gli abbonamenti.</p>`;
      }
    }

    document.getElementById('retry-button').addEventListener('click', loadOffers);
    document.addEventListener('DOMContentLoaded', () => {
      loadCinemaFilter();
      document.getElementById('cinema-filter')?.addEventListener('change', loadOffers);
      loadOffers();
      loadSubscriptions();
    });

    if (!document.querySelector('#navbar-container')?.children.length) {
      setTimeout(() => {
        if (typeof window.initializeNavbar === 'function') {
          window.initializeNavbar();
        }
      }, 100);
    }
  </script>
  <script src="/js/chat-widget.js?v=4"></script>
  <script src="/js/alert-dialog.js"></script>
</body>

</html>

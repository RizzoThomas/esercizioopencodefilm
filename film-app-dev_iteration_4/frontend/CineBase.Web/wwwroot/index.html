  <script>
  // Seamless infinite marquee — clones + smooth scroll, no visible reset
  (function(){
    var track = document.querySelector('.marquee-track');
    if (!track) return;
    var orig = track.querySelector('.marquee-group');
    if (!orig) return;

    // Clone groups so we always have visible buffer (no gray gaps)
    var cloneCount = 5; // total = 1 original + 5 clones = 6 groups
    for (var i = 0; i < cloneCount; i++) {
      track.appendChild(orig.cloneNode(true));
    }

    var speed = 0.6; // px per frame
    var pos = 0;
    var groupCount = 0;
    var cycle = 0;

    function measure() {
      var g = track.querySelectorAll('.marquee-group');
      groupCount = g.length;
      // track.offsetWidth / number of groups = exact width of one group incl. any gap
      cycle = groupCount > 0 ? track.offsetWidth / groupCount : 0;
      if (cycle <= 0) cycle = g[0] ? g[0].offsetWidth : 1000;
    }

    function step() {
      pos -= speed;
      // Reset by one cycle when we've scrolled past the first group
      // With many clones, this reset is completely invisible
      if (pos <= -cycle) pos += cycle;
      track.style.transform = 'translate3d(' + pos.toFixed(4) + 'px, 0, 0)';
      requestAnimationFrame(step);
    }

    measure();
    var ro = new ResizeObserver(measure);
    ro.observe(track);
    requestAnimationFrame(step);
  })();
  </script>

<!DOCTYPE html>
<!-- Pagina CineBase: struttura principale con sezioni statiche e contenuti dinamici gestiti da JavaScript. -->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBase - Completamento Accesso</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .exchange-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: system-ui, sans-serif;
        }
        .exchange-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message {
            color: #ff6b6b;
            margin-top: 1rem;
            display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
    <div class="exchange-container">
        <div class="exchange-card">
            <div class="spinner" id="spinner"></div>
            <h2 id="status-text">Completamento accesso in corso...</h2>
            <p id="status-sub" style="opacity:0.7; font-size:0.9rem;">Scambio del codice di autorizzazione</p>
            <div class="error-message" id="error-msg"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/pages/social-login-complete.js"></script>
  <script src="/js/chat-widget.js?v=4"></script>
  <script src="/js/alert-dialog.js"></script>
</body>
</html>

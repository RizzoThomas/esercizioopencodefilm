<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Login</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=30" rel="stylesheet">
  <script src="/js/route-guard.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js?v=1"></script>
</head>

<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-ferrari-primary tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>
          CineBase
        </a>
      </div>

      <!-- Login Card -->
      <div class=" card-ferrari p-8">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-ink mb-2">Accedi al tuo account</h1>
          <p class="text-body text-sm">Inserisci le tue credenziali per continuare</p>
        </div>

        <!-- Error Alert -->
        <div id="error-alert"
          class="hidden bg-ferrari-primary border border-ferrari-primary/30 text-ferrari-semantic-warning px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <!-- Expired Alert -->
        <div id="expired-alert"
          class="hidden bg-ferrari-primary border border-ferrari-primary/30 text-ferrari-primary px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-clock mr-2"></i>
          <span>La tua sessione è scaduta. Effettua il login per continuare.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-ink mb-2">Email</label>
            <input type="email" id="email" name="email" class="input-ferrari w-full px-4 py-3"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-ink mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="input-ferrari w-full px-4 py-3 pr-12"
                placeholder="Inserisci la password" required autocomplete="current-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                aria-label="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-body hover:text-ink">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-base font-semibold">
            <span id="btn-text">Accedi</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Accesso in corso...
            </span>
          </button>
        </form>

        <div class="text-right mt-3">
          <a href="/forgot-password.html" class="text-body text-xs hover:text-ferrari-primary">
            Password dimenticata?
          </a>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
          <span class="text-body text-sm">oppure</span>
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
        </div>

        <!-- Social Login Buttons — 21st.dev style -->
        <div class="space-y-3 mb-6">
          <a href="http://localhost:5000/auth/login-google"
             class="flex items-center justify-center gap-3 w-full py-3 px-4 rounded-lg text-white text-sm font-medium transition-all hover:scale-[1.02] active:scale-[0.98]"
             style="background:#DB4437;box-shadow:0 4px 14px rgba(219,68,55,0.35)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 262" class="opacity-90">
              <path fill="#fff" d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622l38.755 30.023l2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"></path>
              <path fill="#fff" d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055c-34.523 0-63.824-22.773-74.269-54.25l-1.531.13l-40.298 31.187l-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"></path>
              <path fill="#fff" d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82c0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602z"></path>
              <path fill="#fff" d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0C79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251"></path>
            </svg>
            Accedi con Google
          </a>
          <a href="http://localhost:5000/auth/login-microsoft"
             class="flex items-center justify-center gap-3 w-full py-3 px-4 rounded-lg text-white text-sm font-medium transition-all hover:scale-[1.02] active:scale-[0.98]"
             style="background:#2f2f2f;box-shadow:0 4px 14px rgba(0,0,0,0.3)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" class="opacity-90">
              <path fill="#f1511b" d="M121.666 121.666H0V0h121.666z"></path>
              <path fill="#80cc28" d="M256 121.666H134.335V0H256z"></path>
              <path fill="#00adef" d="M121.663 256.002H0V134.336h121.663z"></path>
              <path fill="#fbbc09" d="M256 256.002H134.335V134.336H256z"></path>
            </svg>
            Accedi con Microsoft
          </a>
        </div>

        <!-- Register Link -->
        <div class="text-center">
          <p class="text-body text-sm">
            Non hai un account?
            <a href="/registrazione.html" class="text-ferrari-primary hover:text-ferrari-primary-light font-medium ml-1">
              Registrati
            </a>
          </p>
        </div>
      </div>

      <!-- Back to Home -->
      <div class="text-center mt-6">
        <a href="/index.html"
          class="text-body hover:text-ferrari-primary text-sm inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js?v=5"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=7"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/chat-widget.js?v=4"></script>
  <script src="/js/alert-dialog.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Registrazione</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css" rel="stylesheet">
  <link href="/css/styles.css?v=30" rel="stylesheet">
  <script src="/js/route-guard.js"></script>
  <script src="/js/theme.js"></script>
</head>

<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col">
  <!-- Contenitore dinamico: navbar-container viene popolato o mostrato da JavaScript. -->
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-ferrari-primary tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>
          CineBase
        </a>
      </div>

      <div class=" card-ferrari p-8">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-ink mb-2">Crea un account</h1>
          <p class="text-body text-sm">Registrati per prenotare proiezioni e gestire i tuoi dati</p>
        </div>

        <div id="error-alert"
          class="hidden bg-ferrari-primary border border-ferrari-primary/30 text-ferrari-semantic-warning px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <div id="success-alert"
          class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Account creato con successo! Reindirizzamento...</span>
        </div>

  <!-- Modulo: raccoglie i dati dell'utente e li invia tramite JavaScript al backend. -->
        <form id="register-form" class="space-y-4">
          <div>
            <label for="nome" class="block text-sm font-medium text-ink mb-2">Nome</label>
            <input type="text" id="nome" name="nome" class="input-ferrari w-full px-4 py-3" placeholder="Mario"
              required autocomplete="given-name">
          </div>

          <div>
            <label for="cognome" class="block text-sm font-medium text-ink mb-2">Cognome</label>
            <input type="text" id="cognome" name="cognome" class="input-ferrari w-full px-4 py-3"
              placeholder="Rossi" required autocomplete="family-name">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-ink mb-2">Email</label>
            <input type="email" id="email" name="email" class="input-ferrari w-full px-4 py-3"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <div>
            <label for="telefono" class="block text-sm font-medium text-ink mb-2">Telefono <span
                class="text-body">(opzionale)</span></label>
            <input type="tel" id="telefono" name="telefono" class="input-ferrari w-full px-4 py-3"
              placeholder="+39 333 1234567" autocomplete="tel">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-ink mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="input-ferrari w-full px-4 py-3 pr-12"
                placeholder="Minimo 8 caratteri" required autocomplete="new-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                aria-label="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-body hover:text-ink">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div id="password-strength" class="mt-2">
              <div class="h-1 bg-canvas-elevated overflow-hidden">
                <div id="strength-bar" class="h-full w-0 bg-ferrari-primary transition-all"></div>
              </div>
              <p id="strength-text" class="text-xs text-body mt-1"></p>
            </div>
          </div>

          <div>
            <label for="confirm-password" class="block text-sm font-medium text-ink mb-2">Conferma
              Password</label>
            <div class="relative">
              <input type="password" id="confirm-password" name="confirmPassword"
                class="input-ferrari w-full px-4 py-3 pr-12" placeholder="Ripeti la password" required
                autocomplete="new-password">
              <button type="button" id="toggle-confirm-password" title="Mostra o nascondi conferma password"
                aria-label="Mostra o nascondi conferma password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-body hover:text-ink">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p id="confirm-error" class="hidden text-ferrari-semantic-warning text-xs mt-1"></p>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-base font-semibold mt-6">
            <span id="btn-text">Crea Account</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Registrazione in corso...
            </span>
          </button>
        </form>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
          <span class="text-body text-sm">oppure</span>
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
        </div>

        <!-- Social Register Buttons -->
        <div class="space-y-3 mb-6">
          <a href="http://localhost:5000/auth/login-google"
             class="flex items-center justify-center gap-3 w-full py-3 px-4 rounded-lg text-white text-sm font-medium transition-all hover:scale-[1.02] active:scale-[0.98]"
             style="background:#DB4437;box-shadow:0 4px 14px rgba(219,68,55,0.35)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 262"><path fill="#fff" d="M255.9 133.5c0-10.7-.9-18.6-2.8-26.7H130.6v48.4h72c-1.5 12-9.3 30.2-26.7 42.4l38.8 30 2.7.3c24.6-22.8 38.8-56.3 38.8-96z"/><path fill="#fff" d="M130.6 261.1c35.2 0 64.8-11.6 86.4-31.6l-41.2-31.9c-11 7.7-25.8 13-45.2 13-34.6 0-63.9-22.8-74.3-54.3l-40.3 31.2-.5 1.5c21.4 42.5 65.5 72 116.6 72z"/><path fill="#fff" d="M56.3 156.4a78 78 0 010-51.7L15.3 71.3l-1.4.6C5.1 89.6 0 109.5 0 130.6s5.1 40.9 14 58.6l42.2-32.8z"/><path fill="#fff" d="M130.6 50.5c24.5 0 41 10.6 50.4 19.4L218 34C195.2 12.9 165.8 0 130.6 0 79.5 0 35.4 29.3 14 72l42.2 32.8c10.6-31.5 39.9-54.3 74.4-54.3z"/></svg>
            Registrati con Google
          </a>
          <a href="http://localhost:5000/auth/login-microsoft"
             class="flex items-center justify-center gap-3 w-full py-3 px-4 rounded-lg text-white text-sm font-medium transition-all hover:scale-[1.02] active:scale-[0.98]"
             style="background:#2f2f2f;box-shadow:0 4px 14px rgba(0,0,0,0.3)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256"><path fill="#f1511b" d="M121.7 121.7H0V0h121.7z"/><path fill="#80cc28" d="M256 121.7H134.3V0H256z"/><path fill="#00adef" d="M121.7 256H0V134.3h121.7z"/><path fill="#fbbc09" d="M256 256H134.3V134.3H256z"/></svg>
            Registrati con Microsoft
          </a>
        </div>

        <div class="text-center">
          <p class="text-body text-sm">
            Hai già un account?
            <a href="/login.html" class="text-ferrari-primary hover:text-ferrari-primary-light font-medium ml-1">Accedi</a>
          </p>
        </div>
      </div>

      <div class="text-center mt-6">
        <a href="/index.html"
          class="text-body hover:text-ferrari-primary text-sm inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>

  <!-- Contenitore dinamico: footer-container viene popolato o mostrato da JavaScript. -->
  <div id="footer-container"></div>

  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js?v=5"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=7"></script>
  <script src="/js/pages/registrazione.js"></script>
  <script src="/js/chat-widget.js?v=4"></script>
  <script src="/js/alert-dialog.js"></script>
</body>

</html>

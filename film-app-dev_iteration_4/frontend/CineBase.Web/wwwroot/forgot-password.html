<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Password Dimenticata</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=26" rel="stylesheet">
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-ferrari-primary tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>
          CineBase
        </a>
      </div>

      <div class="card-ferrari p-8">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-ink mb-2">Password Dimenticata</h1>
          <p class="text-body text-sm">Inserisci la tua email e ti invieremo un link per reimpostare la password.</p>
        </div>

        <div id="error-alert" class="hidden bg-ferrari-primary/10 border border-ferrari-primary/30 text-ferrari-semantic-warning px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <div id="success-alert" class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span id="success-message"></span>
        </div>

        <form id="forgot-form" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-ink mb-2">Email</label>
            <input type="email" id="email" name="email" class="input-ferrari w-full px-4 py-3"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-base font-semibold">
            <span id="btn-text">Invia Link di Reset</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Invio in corso...
            </span>
          </button>
        </form>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
          <span class="text-body text-sm">oppure</span>
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
        </div>

        <div class="text-center">
          <p class="text-body text-sm">
            <a href="/login.html" class="text-ferrari-primary hover:text-ferrari-primary-light font-medium">
              <i class="fa-solid fa-arrow-left mr-1"></i>Torna al Login
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js?v=4"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=6"></script>
  <script src="/js/pages/forgot-password.js"></script>
</body>
</html>

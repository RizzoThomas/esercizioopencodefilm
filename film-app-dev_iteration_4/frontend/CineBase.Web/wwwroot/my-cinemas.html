<!DOCTYPE html>
<!-- Pagina CineBase: struttura principale con sezioni statiche e contenuti dinamici gestiti da JavaScript. -->
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - I Nostri Cinema</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=30" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="/js/route-guard.js"></script>
  <script src="/js/theme.js"></script>
</head>

<body class="bg-canvas text-ink font-sans">
  <!-- Contenitore dinamico: navbar-container viene popolato o mostrato da JavaScript. -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
  <div id="navbar-container"></div>

  <!-- Contenuto principale: area centrale che ospita il flusso della pagina. -->
<!-- Contenuto principale: area centrale dove la pagina mostra il flusso operativo. -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-6">
    <!-- Loading State -->
    <div id="loading-state" class="text-center py-16">
      <i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-ferrari-primary"></i>
      <p class="text-body">Caricamento...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden text-center py-16">
      <i class="fa-solid fa-circle-exclamation text-6xl text-ferrari-semantic-warning mb-4"></i>
      <h3 class="text-xl font-semibold text-ink mb-2">Errore caricamento</h3>
      <p class="text-body mb-4" id="error-message">Impossibile caricare i dati</p>
      <button onclick="window.history.back()" class="btn-outline">
        <i class="fa-solid fa-arrow-left mr-1"></i>Torna indietro
      </button>
    </div>

    <!-- Cinema List View -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
    <div id="cinema-list-view" class="hidden">
      <h1 class="text-2xl md:text-3xl font-bold text-ink mb-6">
        <i class="fa-solid fa-film text-ferrari-primary mr-2"></i>I Nostri Cinema
      </h1>

  <!-- Contenitore dinamico: cinemas-grid viene popolato o mostrato da JavaScript. -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
      <div id="cinemas-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      </div>

      <div id="no-cinemas-state" class="hidden text-center py-16">
        <i class="fa-solid fa-film text-6xl text-body mb-4"></i>
        <h3 class="text-xl font-semibold text-ink mb-2">Nessun cinema disponibile</h3>
        <p class="text-body">Al momento non ci sono cinema nella rete</p>
      </div>
    </div>

    <!-- Cinema Detail View -->
    <div id="cinema-detail-view" class="hidden">
      <!-- Cinema Header -->
      <div class="card-ferrari p-6 mb-6">
        <div class="flex items-start gap-4">
          <div class="flex-1">
            <h1 id="cinema-name" class="text-2xl md:text-3xl font-bold text-ink mb-1"></h1>
            <p id="cinema-address" class="text-body">
              <i class="fa-solid fa-location-dot mr-1"></i><span></span>
            </p>
            <div id="cinema-tipologie" class="flex flex-wrap gap-2 mt-3"></div>
          </div>
          <button onclick="goToCinemaList()" class="btn-outline text-sm">
            <i class="fa-solid fa-arrow-left mr-1"></i>Torna alla lista
          </button>
        </div>
      </div>

      <!-- Date Rail -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
      <div id="date-rail-container" class="mb-6"></div>

      <!-- Accessibility Filters -->
      <div id="accessibility-filters" class="hidden flex flex-wrap items-center gap-3 mb-4">
        <span class="text-sm text-body font-medium">
          <i class="fa-solid fa-universal-access mr-1"></i>Accessibilità:
        </span>
        <button id="filter-subtitles" onclick="toggleAccessibilityFilter('subtitles')"
          class="px-3 py-1.5 text-xs font-medium rounded-full border border-hairline text-body hover:text-ink hover:border-ferrari-primary transition-colors"
          data-active="false">
          <i class="fa-solid fa-closed-captioning mr-1"></i>Sottotitoli
        </button>
        <button id="filter-audiodesc" onclick="toggleAccessibilityFilter('audiodesc')"
          class="px-3 py-1.5 text-xs font-medium rounded-full border border-hairline text-body hover:text-ink hover:border-ferrari-primary transition-colors"
          data-active="false">
          <i class="fa-solid fa-headphones mr-1"></i>Audio Descrizione
        </button>
      </div>

      <!-- Films Schedule -->
      <div id="films-schedule" class="space-y-4">
      </div>

      <!-- No Shows State -->
      <div id="no-shows-state" class="hidden text-center py-12">
        <i class="fa-solid fa-film text-6xl text-body mb-4"></i>
        <h3 class="text-xl font-semibold text-ink mb-2">Nessuno show disponibile</h3>
        <p class="text-body">Non ci sono spettacoli per la data selezionata</p>
      </div>
    </div>
  </main>

  <!-- Contenitore dinamico: footer-container viene popolato o mostrato da JavaScript. -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
  <div id="footer-container"></div>

  <!-- Contenitore dinamico: toast-container viene popolato o mostrato da JavaScript. -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <!-- Mini-Map Modal -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
  <div id="map-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-gray-500/75 modal-backdrop" onclick="closeMapModal()"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative transform overflow-hidden bg-canvas-elevated-lowest text-left shadow-xl transition-all w-full max-w-2xl">
          <div class="bg-canvas-elevated-lowest px-6 pt-6 pb-2 flex items-center justify-between">
            <h3 class="text-lg font-bold text-ink" id="map-cinema-name">Mappa</h3>
            <button type="button" class="text-body hover:text-ink" onclick="closeMapModal()" title="Chiudi" aria-label="Chiudi mappa">
              <i class="fa-solid fa-xmark text-xl"></i>
            </button>
          </div>
  <!-- Contenitore dinamico: map-container viene popolato o mostrato da JavaScript. -->
<!-- Contenitore dinamico: quest'area viene popolata o mostrata da JavaScript. -->
          <div id="map-container" class="w-full" style="height: 400px;"></div>
          <div class="bg-canvas-elevated-low px-6 py-3 flex justify-end">
            <button type="button" class="btn-outline px-4 py-2 text-sm font-medium" onclick="closeMapModal()">Chiudi</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js?v=5"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=7"></script>
  <script src="/js/date-rail.js"></script>
  <script src="/js/pages/my-cinemas.js"></script>
  <script src="/js/chat-widget.js?v=4"></script>
  <script src="/js/alert-dialog.js"></script>
</body>

</html>

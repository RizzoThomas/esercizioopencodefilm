<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Reimposta Password</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css?v=20" rel="stylesheet">
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-ferrari-primary tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>
          CineBase
        </a>
      </div>

      <div class="card-ferrari p-8">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-ink mb-2">Reimposta Password</h1>
          <p class="text-body text-sm">Scegli una nuova password per il tuo account.</p>
        </div>

        <div id="error-alert" class="hidden bg-ferrari-primary/10 border border-ferrari-primary/30 text-ferrari-semantic-warning px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <div id="success-alert" class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Password reimpostata con successo!</span>
        </div>

        <form id="reset-form" class="space-y-5">
          <div>
            <label for="password" class="block text-sm font-medium text-ink mb-2">Nuova Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="input-ferrari w-full px-4 py-3 pr-12"
                placeholder="Minimo 8 caratteri" required minlength="8" autocomplete="new-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-body hover:text-ink">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary w-full py-3 text-base font-semibold">
            <span id="btn-text">Reimposta Password</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Reimpostazione...
            </span>
          </button>
        </form>

        <div id="login-link" class="hidden flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
          <span class="text-body text-sm">fatto</span>
          <div class="flex-1 h-px bg-canvas-elevated/30"></div>
        </div>
        <div id="login-link-text" class="hidden text-center">
          <a href="/login.html" class="text-ferrari-primary hover:text-ferrari-primary-light font-medium">
            <i class="fa-solid fa-arrow-right mr-1"></i>Vai al Login
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js?v=final"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js?v=4"></script>
  <script src="/js/navbar.js?v=4"></script>
  <script src="/js/aceternity-effects.js?v=4"></script>
  <script src="/js/pages/reset-password.js"></script>
</body>
</html>

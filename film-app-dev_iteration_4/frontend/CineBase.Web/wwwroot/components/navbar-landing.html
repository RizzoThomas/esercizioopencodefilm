    <!-- Notification Bell + Dropdown -->

        <span id="notif-badge" class="absolute -top-1.5 -right-2 bg-ferrari-primary text-white text-[9px] font-bold w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>

          <!-- Carousel View -->

              <!-- Delete button — top right -->
              <button class="notif-delete absolute -top-1 -right-1 text-muted hover:text-ferrari-primary text-[11px] p-0.5" data-idx="0" title="Rimuovi">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <div class="flex items-center gap-2 mb-1.5 pr-4">
                <i id="notif-card-icon" class="text-ferrari-primary text-sm"></i>

              <p id="notif-card-desc" class="text-xs text-body leading-relaxed mb-2"></p>

              <i class="fa-solid fa-chevron-right text-[10px]"></i>

            <!-- Dots indicator -->

          <!-- List View (hidden by default) -->

          <!-- Empty state -->
          <div id="notif-empty" class="hidden p-6 text-sm text-body text-center">

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="text-ink hover:text-ferrari-primary transition-colors duration-300" title="Cambia tema" aria-label="Cambia tema chiaro/scuro">

    <div id="user-dropdown" class="hidden relative">

        <i class="fa-solid fa-user"></i>
      </button>
      <div id="user-menu" class="hidden absolute right-0 mt-3 w-48 bg-canvas-elevated border border-hairline z-[60]">
        <a href="/profilo.html" id="desktop-user-name-link" class="block px-4 py-2.5 text-sm text-ink hover:text-ferrari-primary hover:bg-white/5 transition-colors duration-200">
          <i class="fa-solid fa-user mr-2 w-4"></i><span id="desktop-user-name">Profilo</span>
        </a>
        <a href="/profilo.html#prenotazioni" class="block px-4 py-2.5 text-sm text-ink hover:text-ferrari-primary hover:bg-white/5 transition-colors duration-200">
          <i class="fa-solid fa-ticket mr-2 w-4"></i>Prenotazioni
        </a>
        <hr class="my-1 border-hairline">
        <button id="logout-btn" class="w-full text-left px-4 py-2.5 text-sm text-ferrari-semantic-warning hover:bg-white/5 transition-colors duration-200">
          <i class="fa-solid fa-sign-out-alt mr-2 w-4"></i>Logout
        </button>
      </div>
    </div>

    <a href="/login.html" id="login-btn" class="text-ink hover:text-ferrari-primary transition-colors duration-300">
      <i class="fa-solid fa-user"></i>
    </a>
    <a href="/dashboard.html" id="admin-area-btn" class="hidden text-ferrari-primary hover:text-ferrari-hover text-xs uppercase tracking-widest font-semibold admin-only transition-colors duration-200">
      Admin

<div id="mobile-menu-backdrop" class="mobile-menu-backdrop"></div>

<!-- Mobile Menu — Sidebar slide-in -->
<div id="mobile-menu" class="mobile-menu-overlay">
  <div class="flex flex-col gap-1">
    <a href="/index.html" class="mobile-menu-link">Home</a>
    <a href="/programmazione.html" class="mobile-menu-link">Programmazione</a>
    <a href="/my-cinemas.html" class="mobile-menu-link">Cinema</a>
    <a href="/offerte.html" class="mobile-menu-link">Offerte</a>
    <a href="/profilo.html" class="mobile-menu-link">Profilo</a>
    <a href="/dashboard.html" id="mobile-admin-area-btn" class="hidden mobile-menu-link text-ferrari-primary admin-only">Area Admin</a>
  </div>
  <div class="mt-8 flex flex-col gap-3" id="mobile-auth-links">
    <a href="/login.html" class="btn-outline w-full text-center text-sm">Accedi</a>
    <a href="/registrazione.html" class="btn-primary w-full text-center text-sm ripple-container magnetic-btn">Registrati</a>
  </div>
  <div id="mobile-user-menu" class="hidden mt-8 flex flex-col gap-3">
    <p id="mobile-user-name" class="text-ferrari-primary uppercase tracking-wider text-center text-sm"></p>
    <button id="mobile-logout-btn" class="btn-outline w-full text-center text-sm text-ferrari-semantic-warning">Logout</button>
  </div>
</div>

<script>
(function() {
  const loginBtn = document.getElementById('login-btn');
  const userDropdown = document.getElementById('user-dropdown');
  const userMenuToggle = document.getElementById('user-menu-toggle');
  const userMenu = document.getElementById('user-menu');
  const logoutBtn = document.getElementById('logout-btn');
  const mobileAuthLinks = document.getElementById('mobile-auth-links');
  const mobileUserMenu = document.getElementById('mobile-user-menu');
  const mobileUserName = document.getElementById('mobile-user-name');
  const mobileLogoutBtn = document.getElementById('mobile-logout-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const mobileMenuBackdrop = document.getElementById('mobile-menu-backdrop');
  const mainNav = document.getElementById('main-nav');

  // Intensify glass on scroll
  if (mainNav) {
    var scrollTicking = false;
    window.addEventListener('scroll', function() {
      if (!scrollTicking) {
        requestAnimationFrame(function() {
          if (window.scrollY > 10) {
            mainNav.classList.add('scrolled');
          } else {
            mainNav.classList.remove('scrolled');
          }
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });
  }

  function openMenu() {
    if (mobileMenu) mobileMenu.classList.add('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.add('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.add('open');
  }

  function closeMenu() {
    if (mobileMenu) mobileMenu.classList.remove('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.remove('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.remove('open');
  }

  function normalizeRole(role) {
    if (role == null) return '';
    var value = String(role).trim().toLowerCase();
    if (value === '2' || value === 'admin') return 'admin';
    if (value === '1' || value === 'poweruser') return 'poweruser';
    if (value === '0' || value === 'user') return 'user';
    return value;
  }

  function updateAuthUI() {
    if (typeof Auth === 'undefined' || !Auth) {
      document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('hidden'); });
      return;
    }
    var isLoggedIn = Auth.isLoggedIn();
    var role = normalizeRole(isLoggedIn ? (Auth.getUserRole() || null) : null);
    var isAdminOrPowerUser = role === 'admin' || role === 'poweruser';

    if (isLoggedIn && Auth.getUser()) {
      var user = Auth.getUser();
      var nomeCompleto = (user.nome || '') + (user.cognome ? ' ' + user.cognome : '');
      if (!nomeCompleto.trim()) nomeCompleto = user.email || 'Profilo';
      if (loginBtn) loginBtn.classList.add('hidden');
      if (userDropdown) userDropdown.classList.remove('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.add('hidden');
      if (mobileUserMenu) { mobileUserMenu.classList.remove('hidden'); mobileUserName.textContent = nomeCompleto || user.nome || user.email || 'UTENTE'; }
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = nomeCompleto;
    } else {
      if (loginBtn) loginBtn.classList.remove('hidden');
      if (userDropdown) userDropdown.classList.add('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.remove('hidden');
      if (mobileUserMenu) mobileUserMenu.classList.add('hidden');
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = 'Profilo';
    }
    document.querySelectorAll('.admin-only').forEach(function(el) {
      if (isAdminOrPowerUser) el.classList.remove('hidden'); else el.classList.add('hidden');
    });
  }

  // Theme toggle
  var themeToggle = document.getElementById('theme-toggle');
  if (themeToggle && window.CineBaseTheme) {
    themeToggle.addEventListener('click', function() {
      window.CineBaseTheme.toggle();
    });
  }

  // Hamburger morph toggle
  if (mobileMenuToggle && mobileMenu) {
    mobileMenuToggle.addEventListener('click', function() {
      if (mobileMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
    // Prevent navbar.js from adding duplicate listener
    mobileMenuToggle.dataset.menuBound = 'true';
  }

  // Backdrop click closes menu
  if (mobileMenuBackdrop) {
    mobileMenuBackdrop.addEventListener('click', closeMenu);
  }

  // Close menu on link click
  if (mobileMenu) {
    mobileMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', closeMenu);
      link.dataset.menuCloseBound = 'true';
    });
  }

  if (userMenuToggle) userMenuToggle.addEventListener('click', function() { if (userMenu) userMenu.classList.toggle('hidden'); });
  if (logoutBtn) logoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });
  if (mobileLogoutBtn) mobileLogoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });

  document.addEventListener('click', function(e) {
    if (userMenuToggle && userMenu && !userMenuToggle.contains(e.target) && !userMenu.contains(e.target)) { userMenu.classList.add('hidden'); }
  });

  // ── Notifications (context-aware) ─────────────
  var notifContainer = document.getElementById('notif-container');
  var notifPopover = document.getElementById('notif-popover');
  var notifToggle = document.getElementById('notif-toggle');
  var notifBadge = document.getElementById('notif-badge');
  var notifCarousel = document.getElementById('notif-carousel');
  var notifList = document.getElementById('notif-list');
  var notifEmpty = document.getElementById('notif-empty');
  var notifCardIcon = document.getElementById('notif-card-icon');
  var notifCardTitle = document.getElementById('notif-card-title');
  var notifCardTime = document.getElementById('notif-card-time');
  var notifCardDesc = document.getElementById('notif-card-desc');
  var notifDots = document.getElementById('notif-dots');
  var notifViewToggle = document.getElementById('notif-view-toggle');
  var notifViewIcon = document.getElementById('notif-view-icon');

  var notifications = [];
  var currentIndex = 0;
  var isCarousel = true;
  var popoverOpen = false;

  // Dynamic notification generators
  function getEmptyNotifs() {
    return [{
      id: 'empty',
      icon: 'fa-solid fa-lock',
      title: 'Accedi per vedere le notifiche',
      desc: 'Registrati o accedi per ricevere aggiornamenti su biglietti, offerte, rimborsi e molto altro.',
      time: ''
    }];
  }

  function getSampleNotifs() {
    return [
      { id: 'biglietto', icon: 'fa-solid fa-ticket', title: 'Biglietto acquistato', desc: 'Conferma per Interstellar — domani ore 20:30, Sala IMAX.', time: '5 ore fa' },
      { id: 'scadenza', icon: 'fa-solid fa-clock', title: 'Promemoria abbonamento', desc: 'Il tuo abbonamento Premium scade tra 3 giorni. Rinnova ora per non perdere i vantaggi.', time: '1 giorno fa' },
      { id: 'offerta', icon: 'fa-solid fa-tag', title: 'Nuova offerta disponibile', desc: 'Combo Cinema + Popcorn a €12.90 solo questa settimana! Approfittane subito.', time: '2 ore fa' },
      { id: 'rimborso', icon: 'fa-solid fa-rotate-left', title: 'Rimborso in arrivo', desc: 'Il film prenotato è stato cancellato. Riceverai un rimborso sul tuo credito entro 48 ore.', time: '3 ore fa' },
      { id: 'anteprima', icon: 'fa-solid fa-star', title: 'Anteprima esclusiva', desc: 'Prenota i biglietti per l\'anteprima di sabato sera. Posti limitati!', time: '2 giorni fa' }
    ];
  }

  function loadNotifications() {
    var prevCount = notifications.length;
    var loggedIn = typeof Auth !== 'undefined' && Auth && Auth.isLoggedIn && Auth.isLoggedIn();
    if (!loggedIn) {
      notifications = getEmptyNotifs();
      localStorage.removeItem('cb-notifs-deleted');
    } else {
      // Load persisted deleted IDs
      var deleted = [];
      try { deleted = JSON.parse(localStorage.getItem('cb-notifs-deleted') || '[]'); } catch(e) { deleted = []; }
      // Regenerate sample, filter out deleted
      notifications = getSampleNotifs().filter(function(n) {
        return deleted.indexOf(n.id) === -1;
      });
    }
    // Detect new notifications vs previous
    if (loggedIn && notifications.length > 0 && notifications.length !== prevCount) {
      triggerBellPulse();
    }
    updateAll();
  }

  function triggerBellShake() {
    if (!notifToggle) return;
    notifToggle.classList.remove('bell-shake');
    void notifToggle.offsetWidth;
    notifToggle.classList.add('bell-shake');
  }

  function triggerBellPulse() {
    if (!notifToggle) return;
    notifToggle.classList.remove('bell-new-notif');
    void notifToggle.offsetWidth;
    notifToggle.classList.add('bell-new-notif');
    // Remove red after 2.5s
    setTimeout(function() { notifToggle.classList.remove('bell-new-notif'); }, 2500);
  }

  function updateAll() {
    updateBadge();
    rebuildDots();
    if (isCarousel) { currentIndex = 0; renderCarouselCard(); }
    else showList();
    if (notifPopover && popoverOpen) {
      if (isCarousel) { showCarousel(); } else { showList(); }
    }
  }

  function updateBadge() {
    if (!notifBadge) return;
    var loggedIn = typeof Auth !== 'undefined' && Auth && Auth.isLoggedIn && Auth.isLoggedIn();
    if (!loggedIn) {
      notifBadge.textContent = '0';
      notifBadge.classList.add('hidden');
    } else {
      notifBadge.textContent = notifications.length;
      notifBadge.classList.toggle('hidden', notifications.length === 0);
    }
  }

  function rebuildDots() {
    if (!notifDots) return;
    notifDots.innerHTML = '';
    notifications.forEach(function(_, i) {
      var dot = document.createElement('span');
      dot.className = 'notif-dot' + (i === 0 ? ' active' : '');
      notifDots.appendChild(dot);
    });
  }

  function renderCarouselCard() {
    if (!notifCardTitle) return;
    if (notifications.length === 0) {
      notifCardIcon.className = 'fa-solid fa-bell-slash text-muted text-sm';
      notifCardTitle.textContent = 'Nessuna notifica';
      notifCardTime.textContent = '';
      notifCardDesc.textContent = '';
      if (notifDots) notifDots.innerHTML = '';
      return;
    }
    var n = notifications[currentIndex];
    if (!n) return;
    notifCardIcon.className = n.icon + ' text-ferrari-primary text-sm';
    notifCardTitle.textContent = n.title;
    notifCardTime.textContent = n.time;
    notifCardDesc.textContent = n.desc;
    // Update delete button idx
    var delBtn = document.querySelector('#notif-card .notif-delete');
    if (delBtn) delBtn.setAttribute('data-idx', String(currentIndex));
    var card = document.getElementById('notif-card');
    if (card) { card.classList.remove('notif-carousel-enter'); void card.offsetWidth; card.classList.add('notif-carousel-enter'); }
    if (notifDots) {
      var dots = notifDots.querySelectorAll('.notif-dot');
      dots.forEach(function(d, i) { d.classList.toggle('active', i === currentIndex); });
    }
  }

  function persistDeletedIds() {
    var ids = notifications.map(function(n) { return n.id || ''; }).filter(Boolean);
    // Save the complement — IDs that were originally there but now missing = deleted
    var allIds = getSampleNotifs().map(function(n) { return n.id; });
    var deleted = allIds.filter(function(id) { return ids.indexOf(id) === -1; });
    localStorage.setItem('cb-notifs-deleted', JSON.stringify(deleted));
  }

  function deleteNotif(idx) {
    notifications.splice(idx, 1);
    persistDeletedIds();
    if (idx <= currentIndex && currentIndex > 0) currentIndex--;
    if (currentIndex >= notifications.length) currentIndex = Math.max(0, notifications.length - 1);
    updateBadge();
    rebuildDots();
    if (isCarousel) renderCarouselCard(); else showList();
  }

  function clearAllNotifs() {
    // Mark all as deleted
    var allIds = getSampleNotifs().map(function(n) { return n.id; });
    localStorage.setItem('cb-notifs-deleted', JSON.stringify(allIds));
    notifications = [];
    currentIndex = 0;
    updateBadge();
    rebuildDots();
    if (notifDots) notifDots.innerHTML = '';
    if (isCarousel) renderCarouselCard(); else showList();
  }

  function showList() {
    isCarousel = false;
    if (notifCarousel) notifCarousel.classList.add('hidden');
    if (notifList) {
      notifList.classList.remove('hidden');
      if (notifications.length === 0) {
        notifList.innerHTML = '<div class="p-6 text-sm text-body text-center">Nessuna notifica</div>';
      } else {
        notifList.innerHTML = notifications.map(function(n, i) {
          return '<div class="px-4 py-3 hover:bg-white/[0.03] transition relative">' +
            '<button class="notif-delete absolute top-2 right-2 text-muted hover:text-ferrari-primary text-[11px]" data-idx="' + i + '" title="Rimuovi"><i class="fa-solid fa-xmark"></i></button>' +
            '<div class="flex items-center gap-2 mb-1 pr-5">' +
              '<i class="' + n.icon + ' text-ferrari-primary text-xs"></i><span class="font-medium text-sm text-ink">' + n.title + '</span>' +
            '</div>' +
            '<p class="text-xs text-body leading-relaxed mb-1.5">' + n.desc + '</p>' +
            (n.time ? '<span class="text-[10px] text-muted">' + n.time + '</span>' : '') +
          '</div>';
        }).join('');
      }
    }
    if (notifViewIcon) { notifViewIcon.className = 'fa-solid fa-grip text-xs'; }
  }

  function showCarousel() {
    isCarousel = true;
    if (notifCarousel) notifCarousel.classList.remove('hidden');
    if (notifList) notifList.classList.add('hidden');
    if (notifViewIcon) { notifViewIcon.className = 'fa-solid fa-list text-xs'; }
    renderCarouselCard();
  }

  function showList() {
    isCarousel = false;
    if (notifCarousel) notifCarousel.classList.add('hidden');
    if (notifList) {
      notifList.classList.remove('hidden');
      notifList.innerHTML = notifications.map(function(n) {
        return '<div class="px-4 py-3 hover:bg-white/[0.03] transition">' +
          '<div class="flex justify-between items-center mb-1">' +
            '<div class="flex items-center gap-2"><i class="' + n.icon + ' text-ferrari-primary text-xs"></i><span class="font-medium text-sm text-ink">' + n.title + '</span></div>' +
            (n.time ? '<span class="text-xs text-muted">' + n.time + '</span>' : '') +
          '</div>' +
          '<p class="text-xs text-body leading-relaxed">' + n.desc + '</p>' +
        '</div>';
      }).join('');
    }
    if (notifViewIcon) { notifViewIcon.className = 'fa-solid fa-grip text-xs'; }
  }

  function nextNotif() {
    currentIndex = (currentIndex + 1) % notifications.length;
    renderCarouselCard();
  }

  function prevNotif() {
    currentIndex = (currentIndex - 1 + notifications.length) % notifications.length;
    renderCarouselCard();
  }

  function openPopover() {
    popoverOpen = true;
    if (notifPopover) notifPopover.classList.remove('hidden');
    if (notifications.length === 0) {
      // Empty state
      if (notifCarousel) notifCarousel.classList.add('hidden');
      if (notifList) { notifList.classList.add('hidden'); }
      if (notifEmpty) {
        notifEmpty.innerHTML = '<i class="fa-solid fa-bell-slash text-2xl text-muted block mb-2"></i><p class="text-sm text-body">Non ci sono notifiche presenti</p>';
        notifEmpty.classList.remove('hidden');
      }
    } else {
      if (notifEmpty) notifEmpty.classList.add('hidden');
      if (isCarousel) showCarousel(); else showList();
    }
  }

  function closePopover() {
    popoverOpen = false;
    if (notifPopover) notifPopover.classList.add('hidden');
  }

  // Events
  if (notifToggle) {
    notifToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      triggerBellShake();
      popoverOpen ? closePopover() : openPopover();
    });
  }

  if (notifViewToggle) {
    notifViewToggle.addEventListener('click', function() {
      isCarousel ? showList() : showCarousel();
    });
  }

  document.getElementById('notif-prev')?.addEventListener('click', function(e) { e.stopPropagation(); prevNotif(); });
  document.getElementById('notif-next')?.addEventListener('click', function(e) { e.stopPropagation(); nextNotif(); });
  document.getElementById('notif-clear-all')?.addEventListener('click', function(e) { e.stopPropagation(); clearAllNotifs(); });

  // Event delegation for dynamically created delete buttons
  if (notifPopover) {
    notifPopover.addEventListener('click', function(e) {
      var btn = e.target.closest('.notif-delete');
      if (btn) {
        e.stopPropagation();
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        if (!isNaN(idx) && idx >= 0 && idx < notifications.length) {
          deleteNotif(idx);
        }
      }
    });
  }

  document.addEventListener('click', function(e) {
    if (popoverOpen && notifContainer && !notifContainer.contains(e.target)) {
      closePopover();
    }
  });

  loadNotifications();
  // Reload on auth changes
  document.addEventListener('components:loaded', loadNotifications);

  // Chain updateAuthUI — wrap the original AFTER it's set
  var _chainDone = false;
  function _chainNotifReload() {
    if (_chainDone) return;
    // Wait one tick for other scripts to set window.updateAuthUI
    setTimeout(function() {
      var orig = window.updateAuthUI;
      window.updateAuthUI = function() {
        if (orig) orig();
        loadNotifications();
      };
      _chainDone = true;
    }, 50);
  }
  _chainNotifReload();

  window.updateAuthUI = updateAuthUI;
  window.updateNavbarCinema = function() {};
  if (typeof window.initializeNavbar === 'function') { var orig = window.initializeNavbar; window.initializeNavbar = function() { orig(); updateAuthUI(); }; }
  else { window.initializeNavbar = updateAuthUI; }
  updateAuthUI();
  document.addEventListener('components:loaded', updateAuthUI);
})();
</script>

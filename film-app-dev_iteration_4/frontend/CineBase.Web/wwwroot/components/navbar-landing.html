          <!-- Carousel View -->

<!-- Mobile Menu — Sidebar slide-in -->

  <div class="flex flex-col gap-1">
    <a href="/index.html" class="mobile-menu-link">Home</a>
    <a href="/programmazione.html" class="mobile-menu-link">Programmazione</a>
    <a href="/my-cinemas.html" class="mobile-menu-link">Cinema</a>
    <a href="/offerte.html" class="mobile-menu-link">Offerte</a>
    <a href="/profilo.html" class="mobile-menu-link">Profilo</a>
    <a href="/dashboard.html" id="mobile-admin-area-btn" class="hidden mobile-menu-link text-ferrari-primary admin-only">Area Admin</a>
  </div>
  <div class="mt-8 flex flex-col gap-3" id="mobile-auth-links">
    <a href="/login.html" class="btn-outline w-full text-center text-sm">Accedi</a>
    <a href="/registrazione.html" class="btn-primary w-full text-center text-sm ripple-container magnetic-btn">Registrati</a>
  </div>

    <p id="mobile-user-name" class="text-ferrari-primary uppercase tracking-wider text-center text-sm"></p>
    <button id="mobile-logout-btn" class="btn-outline w-full text-center text-sm text-ferrari-semantic-warning">Logout</button>
  </div>
</div>

<script>
(function() {
  const loginBtn = document.getElementById('login-btn');
  const userDropdown = document.getElementById('user-dropdown');
  const userMenuToggle = document.getElementById('user-menu-toggle');
  const userMenu = document.getElementById('user-menu');
  const logoutBtn = document.getElementById('logout-btn');
  const mobileAuthLinks = document.getElementById('mobile-auth-links');
  const mobileUserMenu = document.getElementById('mobile-user-menu');
  const mobileUserName = document.getElementById('mobile-user-name');
  const mobileLogoutBtn = document.getElementById('mobile-logout-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const mobileMenuBackdrop = document.getElementById('mobile-menu-backdrop');
  const mainNav = document.getElementById('main-nav');

  // Intensify glass on scroll
  if (mainNav) {
    var scrollTicking = false;
    window.addEventListener('scroll', function() {
      if (!scrollTicking) {
        requestAnimationFrame(function() {
          if (window.scrollY > 10) {
            mainNav.classList.add('scrolled');
          } else {
            mainNav.classList.remove('scrolled');
          }
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });
  }

  function openMenu() {
    if (mobileMenu) mobileMenu.classList.add('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.add('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.add('open');
  }

  function closeMenu() {
    if (mobileMenu) mobileMenu.classList.remove('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.remove('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.remove('open');
  }

  function normalizeRole(role) {
    if (role == null) return '';
    var value = String(role).trim().toLowerCase();
    if (value === '2' || value === 'admin') return 'admin';
    if (value === '1' || value === 'poweruser') return 'poweruser';
    if (value === '0' || value === 'user') return 'user';
    return value;
  }

  function updateAuthUI() {
    if (typeof Auth === 'undefined' || !Auth) {
      document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('hidden'); });
      return;
    }
    var isLoggedIn = Auth.isLoggedIn();
    var role = normalizeRole(isLoggedIn ? (Auth.getUserRole() || null) : null);
    var isAdminOrPowerUser = role === 'admin' || role === 'poweruser';

    if (isLoggedIn && Auth.getUser()) {
      var user = Auth.getUser();
      var nomeCompleto = (user.nome || '') + (user.cognome ? ' ' + user.cognome : '');
      if (!nomeCompleto.trim()) nomeCompleto = user.email || 'Profilo';
      if (loginBtn) loginBtn.classList.add('hidden');
      if (userDropdown) userDropdown.classList.remove('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.add('hidden');
      if (mobileUserMenu) { mobileUserMenu.classList.remove('hidden'); mobileUserName.textContent = nomeCompleto || user.nome || user.email || 'UTENTE'; }
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = nomeCompleto;
    } else {
      if (loginBtn) loginBtn.classList.remove('hidden');
      if (userDropdown) userDropdown.classList.add('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.remove('hidden');
      if (mobileUserMenu) mobileUserMenu.classList.add('hidden');
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = 'Profilo';
    }
    document.querySelectorAll('.admin-only').forEach(function(el) {
      if (isAdminOrPowerUser) el.classList.remove('hidden'); else el.classList.add('hidden');
    });
  }

  // Theme toggle
  var themeToggle = document.getElementById('theme-toggle');
  if (themeToggle && window.CineBaseTheme) {
    themeToggle.addEventListener('click', function() {
      window.CineBaseTheme.toggle();
    });
  }

  // Hamburger morph toggle
  if (mobileMenuToggle && mobileMenu) {
    mobileMenuToggle.addEventListener('click', function() {
      if (mobileMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
    // Prevent navbar.js from adding duplicate listener
    mobileMenuToggle.dataset.menuBound = 'true';
  }

  // Backdrop click closes menu
  if (mobileMenuBackdrop) {
    mobileMenuBackdrop.addEventListener('click', closeMenu);
  }

  // Close menu on link click
  if (mobileMenu) {
    mobileMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', closeMenu);
      link.dataset.menuCloseBound = 'true';
    });
  }

  if (userMenuToggle) userMenuToggle.addEventListener('click', function() { if (userMenu) userMenu.classList.toggle('hidden'); });
  if (logoutBtn) logoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });
  if (mobileLogoutBtn) mobileLogoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });

  document.addEventListener('click', function(e) {
    if (userMenuToggle && userMenu && !userMenuToggle.contains(e.target) && !userMenu.contains(e.target)) { userMenu.classList.add('hidden'); }
  });

  // ── Notifications ──────────────────────────────
  var notifContainer = document.getElementById('notif-container');
  var notifPopover = document.getElementById('notif-popover');
  var notifToggle = document.getElementById('notif-toggle');
  var notifBadge = document.getElementById('notif-badge');
  var notifCarousel = document.getElementById('notif-carousel');
  var notifList = document.getElementById('notif-list');
  var notifEmpty = document.getElementById('notif-empty');
  var notifCardIcon = document.getElementById('notif-card-icon');
  var notifCardTitle = document.getElementById('notif-card-title');
  var notifCardTime = document.getElementById('notif-card-time');
  var notifCardDesc = document.getElementById('notif-card-desc');
  var notifDots = document.getElementById('notif-dots');
  var notifViewToggle = document.getElementById('notif-view-toggle');
  var notifViewIcon = document.getElementById('notif-view-icon');

  // Cinema-relevant notifications
  var notifications = [
    { icon: 'fa-solid fa-film', title: 'Nuovo film in sala', desc: 'Dune - Parte Tre è ora in programmazione in tutti i cinema.', time: 'Adesso' },
    { icon: 'fa-solid fa-tag', title: 'Offerta speciale', desc: 'Combo Cinema + Popcorn a €12.90 solo questa settimana!', time: '2 ore fa' },
    { icon: 'fa-solid fa-ticket', title: 'Biglietto acquistato', desc: 'Conferma per Interstellar — domani ore 20:30, Sala IMAX.', time: '5 ore fa' },
    { icon: 'fa-solid fa-clock', title: 'Promemoria', desc: 'Il tuo abbonamento Premium scade tra 3 giorni. Rinnova ora.', time: '1 giorno fa' },
    { icon: 'fa-solid fa-star', title: 'Anteprima esclusiva', desc: 'Prenota i biglietti per l\'anteprima di sabato sera.', time: '2 giorni fa' }
  ];

  var currentIndex = 0;
  var isCarousel = true;
  var popoverOpen = false;

  function updateBadge() {
    if (notifBadge) {
      notifBadge.textContent = notifications.length;
      notifBadge.classList.toggle('hidden', notifications.length === 0);
    }
  }

  function renderCarouselCard() {
    if (!notifCardTitle) return;
    var n = notifications[currentIndex];
    if (!n) return;
    notifCardIcon.className = n.icon + ' text-ferrari-primary text-sm';
    notifCardTitle.textContent = n.title;
    notifCardTime.textContent = n.time;
    notifCardDesc.textContent = n.desc;
    // Animate
    var card = document.getElementById('notif-card');
    if (card) { card.classList.remove('notif-carousel-enter'); void card.offsetWidth; card.classList.add('notif-carousel-enter'); }
    // Update dots
    if (notifDots) {
      var dots = notifDots.querySelectorAll('.notif-dot');
      dots.forEach(function(d, i) { d.classList.toggle('active', i === currentIndex); });
    }
  }

  function showCarousel() {
    isCarousel = true;
    if (notifCarousel) notifCarousel.classList.remove('hidden');
    if (notifList) notifList.classList.add('hidden');
    if (notifViewIcon) { notifViewIcon.className = 'fa-solid fa-list text-xs'; }
    renderCarouselCard();
  }

  function showList() {
    isCarousel = false;
    if (notifCarousel) notifCarousel.classList.add('hidden');
    if (notifList) {
      notifList.classList.remove('hidden');
      notifList.innerHTML = notifications.map(function(n) {
        return '<div class="px-4 py-3 hover:bg-white/[0.03] transition">' +
          '<div class="flex justify-between items-center mb-1">' +
            '<div class="flex items-center gap-2"><i class="' + n.icon + ' text-ferrari-primary text-xs"></i><span class="font-medium text-sm text-ink">' + n.title + '</span></div>' +
            '<span class="text-xs text-muted">' + n.time + '</span>' +
          '</div>' +
          '<p class="text-xs text-body leading-relaxed">' + n.desc + '</p>' +
        '</div>';
      }).join('');
    }
    if (notifViewIcon) { notifViewIcon.className = 'fa-solid fa-grip text-xs'; }
  }

  function nextNotif() {
    currentIndex = (currentIndex + 1) % notifications.length;
    renderCarouselCard();
  }

  function prevNotif() {
    currentIndex = (currentIndex - 1 + notifications.length) % notifications.length;
    renderCarouselCard();
  }

  function openPopover() {
    popoverOpen = true;
    if (notifPopover) notifPopover.classList.remove('hidden');
    if (isCarousel) showCarousel(); else showList();
  }

  function closePopover() {
    popoverOpen = false;
    if (notifPopover) notifPopover.classList.add('hidden');
  }

  // Build dots
  if (notifDots) {
    notifications.forEach(function(_, i) {
      var dot = document.createElement('span');
      dot.className = 'notif-dot' + (i === 0 ? ' active' : '');
      notifDots.appendChild(dot);
    });
  }

  // Events
  if (notifToggle) {
    notifToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      popoverOpen ? closePopover() : openPopover();
    });
  }

  if (notifViewToggle) {
    notifViewToggle.addEventListener('click', function() {
      isCarousel ? showList() : showCarousel();
    });
  }

  document.getElementById('notif-prev')?.addEventListener('click', function(e) { e.stopPropagation(); prevNotif(); });
  document.getElementById('notif-next')?.addEventListener('click', function(e) { e.stopPropagation(); nextNotif(); });

  // Click outside closes popover
  document.addEventListener('click', function(e) {
    if (popoverOpen && notifContainer && !notifContainer.contains(e.target)) {
      closePopover();
    }
  });

  updateBadge();
  // Initial render
  renderCarouselCard();

  window.updateAuthUI = updateAuthUI;
  window.updateNavbarCinema = function() {};
  if (typeof window.initializeNavbar === 'function') { var orig = window.initializeNavbar; window.initializeNavbar = function() { orig(); updateAuthUI(); }; }
  else { window.initializeNavbar = updateAuthUI; }
  updateAuthUI();
  document.addEventListener('components:loaded', updateAuthUI);
})();
</script>

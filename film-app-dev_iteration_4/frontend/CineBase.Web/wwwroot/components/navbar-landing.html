    <button id="mobile-logout-btn" class="btn-outline w-full text-center text-sm text-ferrari-semantic-warning">Logout</button>
  </div>
</div>

<script>
(function() {
  const loginBtn = document.getElementById('login-btn');
  const userDropdown = document.getElementById('user-dropdown');
  const userMenuToggle = document.getElementById('user-menu-toggle');
  const userMenu = document.getElementById('user-menu');
  const logoutBtn = document.getElementById('logout-btn');
  const mobileAuthLinks = document.getElementById('mobile-auth-links');
  const mobileUserMenu = document.getElementById('mobile-user-menu');
  const mobileUserName = document.getElementById('mobile-user-name');
  const mobileLogoutBtn = document.getElementById('mobile-logout-btn');
  const mobileMenu = document.getElementById('mobile-menu');
  const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
  const mobileMenuBackdrop = document.getElementById('mobile-menu-backdrop');
  const mainNav = document.getElementById('main-nav');

  // Intensify glass on scroll
  if (mainNav) {
    var scrollTicking = false;
    window.addEventListener('scroll', function() {
      if (!scrollTicking) {
        requestAnimationFrame(function() {
          if (window.scrollY > 10) {
            mainNav.classList.add('scrolled');
          } else {
            mainNav.classList.remove('scrolled');
          }
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });
  }

  function openMenu() {
    if (mobileMenu) mobileMenu.classList.add('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.add('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.add('open');
  }

  function closeMenu() {
    if (mobileMenu) mobileMenu.classList.remove('open');
    if (mobileMenuToggle) mobileMenuToggle.classList.remove('hamburger-open');
    if (mobileMenuBackdrop) mobileMenuBackdrop.classList.remove('open');
  }

  function normalizeRole(role) {
    if (role == null) return '';
    var value = String(role).trim().toLowerCase();
    if (value === '2' || value === 'admin') return 'admin';
    if (value === '1' || value === 'poweruser') return 'poweruser';
    if (value === '0' || value === 'user') return 'user';
    return value;
  }

  function updateAuthUI() {
    if (typeof Auth === 'undefined' || !Auth) {
      document.querySelectorAll('.admin-only').forEach(function(el) { el.classList.add('hidden'); });
      return;
    }
    var isLoggedIn = Auth.isLoggedIn();
    var role = normalizeRole(isLoggedIn ? (Auth.getUserRole() || null) : null);
    var isAdminOrPowerUser = role === 'admin' || role === 'poweruser';

    if (isLoggedIn && Auth.getUser()) {
      var user = Auth.getUser();
      var nomeCompleto = (user.nome || '') + (user.cognome ? ' ' + user.cognome : '');
      if (!nomeCompleto.trim()) nomeCompleto = user.email || 'Profilo';
      if (loginBtn) loginBtn.classList.add('hidden');
      if (userDropdown) userDropdown.classList.remove('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.add('hidden');
      if (mobileUserMenu) { mobileUserMenu.classList.remove('hidden'); mobileUserName.textContent = nomeCompleto || user.nome || user.email || 'UTENTE'; }
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = nomeCompleto;
    } else {
      if (loginBtn) loginBtn.classList.remove('hidden');
      if (userDropdown) userDropdown.classList.add('hidden');
      if (mobileAuthLinks) mobileAuthLinks.classList.remove('hidden');
      if (mobileUserMenu) mobileUserMenu.classList.add('hidden');
      var desktopUserName = document.getElementById('desktop-user-name');
      if (desktopUserName) desktopUserName.textContent = 'Profilo';
    }
    document.querySelectorAll('.admin-only').forEach(function(el) {
      if (isAdminOrPowerUser) el.classList.remove('hidden'); else el.classList.add('hidden');
    });
  }

  // Hamburger morph toggle
  if (mobileMenuToggle && mobileMenu) {
    mobileMenuToggle.addEventListener('click', function() {
      if (mobileMenu.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });
    // Prevent navbar.js from adding duplicate listener
    mobileMenuToggle.dataset.menuBound = 'true';
  }

  // Backdrop click closes menu
  if (mobileMenuBackdrop) {
    mobileMenuBackdrop.addEventListener('click', closeMenu);
  }

  // Close menu on link click
  if (mobileMenu) {
    mobileMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', closeMenu);
      link.dataset.menuCloseBound = 'true';
    });
  }

  if (userMenuToggle) userMenuToggle.addEventListener('click', function() { if (userMenu) userMenu.classList.toggle('hidden'); });
  if (logoutBtn) logoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });
  if (mobileLogoutBtn) mobileLogoutBtn.addEventListener('click', function() { Auth && Auth.logout().then(function() { window.location.href = '/index.html'; }).catch(function() { window.location.href = '/index.html'; }); });

  document.addEventListener('click', function(e) {
    if (userMenuToggle && userMenu && !userMenuToggle.contains(e.target) && !userMenu.contains(e.target)) { userMenu.classList.add('hidden'); }
  });

  window.updateAuthUI = updateAuthUI;
  window.updateNavbarCinema = function() {};
  if (typeof window.initializeNavbar === 'function') { var orig = window.initializeNavbar; window.initializeNavbar = function() { orig(); updateAuthUI(); }; }
  else { window.initializeNavbar = updateAuthUI; }
  updateAuthUI();
  document.addEventListener('components:loaded', updateAuthUI);
})();
</script>
